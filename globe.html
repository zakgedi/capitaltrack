*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}html{scroll-behavior:smooth}body{overflow-x:hidden}
body{font-family:'Newsreader',Georgia,serif;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
a{color:inherit}
.back{font-style:italic;color:var(--mut);font-size:13.5px;cursor:pointer;margin-bottom:14px;display:inline-block}
.back:hover{color:var(--ink)}
.search{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line2);padding:0 0 8px;margin-bottom:6px;color:var(--mut)}
.search input{flex:1;border:0;outline:0;font-family:inherit;font-size:16px;color:var(--ink);background:transparent;padding:4px 0}
#stop{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:calc(72px + env(safe-area-inset-left,0px));right:calc(16px + env(safe-area-inset-right,0px));z-index:60}
#stop .search{margin-bottom:0;background:rgba(255,255,255,.94);padding:6px 8px 8px;border-bottom-color:var(--ink)}
#kpis{flex:none;display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;padding:9px 12px calc(9px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
#kpis b{color:var(--ink);font-weight:600}
.ptable{margin-top:4px}
.pthead{display:grid;grid-template-columns:38px 1fr auto;gap:10px;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--mut2);padding:10px 0 6px;border-bottom:1px solid var(--ink)}
.psec{display:flex;justify-content:space-between;align-items:baseline;padding:13px 2px 9px;border-bottom:1px solid var(--ink);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink);cursor:pointer;margin-top:10px}
.psec:hover{background:var(--tint)}
.psec .ct{color:var(--mut);letter-spacing:.08em;font-size:11px}
.prow{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.prow:hover{background:var(--tint)}
.pr{font-style:italic;color:var(--mut);font-size:13px}
.pn{font-size:16.5px;font-weight:500}
.pn .pc{display:block;font-weight:400;font-style:italic;color:var(--mut);font-size:12.5px;margin-top:1px}
.pa{color:var(--mut);font-size:13.5px;text-align:right;white-space:nowrap}
.record{padding-top:2px}
.receyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--mut);margin-bottom:10px}
.recname{font-weight:500;font-size:30px;margin:0 0 4px;letter-spacing:.01em}
.recloc{font-style:italic;color:var(--mut);font-size:15px;margin-bottom:18px}
.knowrow{display:flex;align-items:center;gap:9px;font-size:15px;padding:11px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;margin-bottom:18px;user-select:none}
.knowrow input{width:16px;height:16px;accent-color:#141414;cursor:pointer}
.frow{margin:0 0 18px}
.frow label{display:block;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.textin{width:100%;border:1px solid var(--line2);background:#fff;padding:10px 12px;font-size:15px;font-family:inherit;color:var(--ink);outline:0;border-radius:0;resize:vertical}
.textin:focus{border-color:var(--ink)}
.askrow{display:flex;gap:8px}
.askrow .askin{flex:1}
.primary{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:10px 20px;font-size:11px;letter-spacing:.26em;text-transform:uppercase;font-family:inherit;cursor:pointer;border-radius:0}
.primary:hover{background:#000}
.reqzone{margin:-6px 0 20px}
.req{border:1px solid var(--line);border-left:2px solid var(--ink);padding:10px 12px;margin-bottom:8px}
.req.ret{background:var(--tint)}
.reqhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.reqhead b{font-weight:600;font-size:14.5px}
.reqmeta{font-style:italic;color:var(--mut);font-size:12px;flex:1}
.remove{border:0;background:none;color:var(--mut);font-size:16px;cursor:pointer;padding:0 2px;line-height:1}
.remove:hover{color:var(--ink)}
.reqbody{font-size:14px;color:var(--ink);margin-top:6px;white-space:pre-wrap}
.secthead{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--ink);padding-bottom:6px;margin:26px 0 4px;font-size:11px;letter-spacing:.24em;text-transform:uppercase}
.secthead span{color:var(--mut);letter-spacing:0;text-transform:none;font-style:italic}
.staffrow{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;row-gap:1px;align-items:start;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.staffrow:hover{background:var(--tint)}
.pstaff{margin:0 0 8px 48px;border-left:1px solid var(--line);padding-left:14px}
.fdesc{margin:2px 0 0 48px;border-left:1px solid var(--line);padding:10px 0 0 14px;font-size:13px;line-height:1.55;color:var(--mut);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.fdesc.open{display:block;-webkit-line-clamp:unset}
.fmore{margin:0 0 4px 48px;border-left:1px solid var(--line);padding:4px 0 8px 14px;font-size:12.5px;color:var(--ink);cursor:pointer;font-style:italic}
.fmore:hover{text-decoration:underline}
#cmodal{position:absolute;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(20,20,20,.18);padding:20px}
.cmcard{background:#fff;border:1px solid var(--ink);box-shadow:0 18px 60px rgba(0,0,0,.18);width:min(520px,100%);max-height:min(70vh,640px);overflow-y:auto;padding:18px 20px;-webkit-overflow-scrolling:touch}
.cmhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.cmx{border:1px solid var(--line2);background:#fff;width:36px;height:36px;font-size:18px;color:var(--ink);cursor:pointer;line-height:1;flex:none}
.cmx:hover{border-color:var(--ink)}
.cmdesc{font-size:14.5px;line-height:1.6;color:var(--ink);margin:0 0 14px}
@media (max-width:640px){#cmodal{align-items:flex-end;padding:0}.cmcard{width:100%;max-height:72vh;border-left:0;border-right:0;border-bottom:0}}
.sn{font-size:16px;font-weight:500}
.sr{font-style:italic;color:var(--mut);font-size:13px;text-align:left;grid-column:1;grid-row:2}
.unv{font-style:italic;color:#8a2f23;font-size:11.5px;border:1px solid rgba(138,47,35,.4);padding:1px 6px;white-space:nowrap;grid-column:2;grid-row:1;justify-self:end;align-self:start;margin-top:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.pill{display:inline-block;border:1px solid var(--line2);padding:6px 12px;font-size:13px;text-decoration:none;color:var(--ink)}
.pill:hover{border-color:var(--ink)}
.pill.warn{border-color:rgba(138,47,35,.45);color:#8a2f23;font-style:italic}
.note{font-size:14.5px;color:var(--ink);background:var(--tint);padding:10px 12px;margin-bottom:18px}
.note a{color:var(--mut);font-style:italic}
.empty{font-style:italic;color:var(--mut);padding:26px 0;font-size:15px}
.toast{position:absolute;left:50%;bottom:calc(70px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(8px);background:var(--ink);color:#fff;font-size:13.5px;padding:9px 16px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:120;font-style:italic}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#globewrap{position:absolute;inset:0;background:#fff;z-index:1;overflow:hidden;touch-action:none}
#globesvg{display:block;width:100%;height:100%;cursor:grab;touch-action:pan-y!important}
#globesvg:active{cursor:grabbing}
.gzoom{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:calc(16px + env(safe-area-inset-left,0px));z-index:30;display:flex;flex-direction:column;gap:6px}
.gzoom button{width:40px;height:40px;border:1px solid var(--line2);background:rgba(255,255,255,.92);font-family:inherit;font-size:20px;color:var(--ink);cursor:pointer;line-height:1;border-radius:0}
.gzoom button:hover{border-color:var(--ink)}
#panel{position:absolute;left:50%;transform:translateX(-50%) translateY(103%);bottom:0;width:min(760px,100vw);height:34vh;background:#fff;border-top:1px solid var(--ink);z-index:70;display:flex;flex-direction:column;box-shadow:0 -10px 34px rgba(0,0,0,.10);transition:transform .6s cubic-bezier(.2,.85,.3,1),height .26s cubic-bezier(.2,.85,.3,1)}
#panel.risen{transform:translateX(-50%) translateY(0)}
#pgrab{flex:0 0 30px;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;user-select:none;border-bottom:1px solid var(--line);background:#fff}
#pgrab:active{cursor:grabbing}
#pgrab .grip{width:46px;height:4px;background:var(--line2)}
#pgrab:hover .grip{background:var(--ink)}
#pview{flex:1;overflow-y:auto;padding:12px 20px calc(22px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
#panel.collapsed{box-shadow:0 -4px 18px rgba(0,0,0,.07)}
#panel.collapsed #pview{display:none}
@media (min-width:761px){
 #panel{left:auto;right:0;top:0;bottom:0;width:420px;height:100%;transform:translateX(103%);border-top:0;border-left:1px solid var(--ink);border-right:0;box-shadow:-10px 0 34px rgba(0,0,0,.10);transition:transform .6s cubic-bezier(.2,.85,.3,1),width .26s cubic-bezier(.2,.85,.3,1)}
 #panel.risen{transform:translateX(0)}
 #panel.risen.collapsed{transform:translateX(100%);box-shadow:none}
 #pgrab{position:absolute;left:0;top:0;bottom:0;width:14px;flex:none;cursor:col-resize;border-bottom:0;border-right:1px solid var(--line)}
 #pgrab .grip{width:4px;height:46px}
 #pview{margin-left:14px}
 #kpis{margin-left:14px}
 #stop{right:calc(436px + env(safe-area-inset-right,0px))}
}
@media (max-width:640px){
 .recname{font-size:25px}
 #pview{padding:12px 16px 20px}
}
/* The globe retains its self-contained viewport; the second pane scrolls below it. */
#globe-pane{position:relative;height:100vh;height:100dvh;min-height:500px;overflow:hidden;isolation:isolate}
#pane-cue{position:absolute;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(34vh + 14px);z-index:65;border:1px solid var(--ink);background:#fff;color:var(--ink);width:40px;height:40px;display:grid;place-items:center;text-decoration:none;font:20px Arial,sans-serif}
@media(min-width:761px){#pane-cue{right:calc(436px + env(safe-area-inset-right,0px));bottom:24px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

let deskW=420;

function snapSheet(h){return h<SHEET_MIN+60?SHEET_MIN:h}

function setupSheet(){const grab=document.getElementById('pgrab');
 grab.addEventListener('pointerdown',function(e){sheetDrag={x:e.clientX,y:e.clientY,h:sheetEl().getBoundingClientRect().height,w:sheetEl().getBoundingClientRect().width,moved:false};sheetEl().style.transition='none';try{grab.setPointerCapture(e.pointerId)}catch(x){}e.preventDefault()});
 grab.addEventListener('pointermove',function(e){if(!sheetDrag)return;if(isDesk()){const dx=sheetDrag.x-e.clientX;if(Math.abs(dx)>3)sheetDrag.moved=true;deskW=Math.max(280,Math.min(Math.round(window.innerWidth*0.7),Math.round(sheetDrag.w+dx)));sheetEl().style.width=deskW+'px'}else{const dy=sheetDrag.y-e.clientY;if(Math.abs(dy)>3)sheetDrag.moved=true;applySheet(sheetDrag.h+dy)}});
 grab.addEventListener('pointerup',function(){if(!sheetDrag)return;const moved=sheetDrag.moved;sheetDrag=null;sheetEl().style.transition='';if(!moved){toggleSheet();return}if(!isDesk()){applySheet(snapSheet(sheetEl().getBoundingClientRect().height));saveSheetUI()}});
 grab.addEventListener('pointercancel',function(){sheetDrag=null;sheetEl().style.transition=''});
}

function renderListRows(){const el=document.getElementById('plrows');if(!el)return;const q=plQ.trim().toLowerCase();
