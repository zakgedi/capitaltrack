<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Pipeline · LP Globe</title>
<style>
:root{--ink:#141414;--sub:#666;--rule:#dedede;--soft:#f6f6f5}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fff;color:var(--ink)}body{font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;font-size:14px}button,input,select{font:inherit}button{cursor:pointer;border-radius:0}a{color:inherit}.shell{max-width:1680px;margin:auto;padding:0 28px}.top{border-bottom:1px solid var(--ink)}.top-inner{min-height:76px;display:flex;align-items:center;gap:23px}.brand{font-family:Georgia,serif;letter-spacing:-.055em;font-size:24px;font-weight:600;text-decoration:none;white-space:nowrap}.divider{height:23px;width:1px;background:var(--rule)}h1{font-size:15px;letter-spacing:-.025em;margin:0;font-weight:600}.actions{margin-left:auto;display:flex;align-items:center;gap:12px}.search{border:1px solid var(--rule);width:230px;height:38px;padding:0 12px;outline:0;border-radius:0;min-width:0}.search:focus,.pick-search:focus{border-color:var(--ink)}.add{height:38px;min-width:38px;border:1px solid var(--ink);background:var(--ink);color:white;font-size:23px;line-height:1;display:flex;align-items:center;justify-content:center}.add:hover{background:#333}.heading{padding-top:30px;padding-bottom:22px;display:flex;justify-content:space-between;align-items:baseline;gap:20px}.heading h2{font-family:Georgia,serif;font-size:30px;letter-spacing:-.04em;font-weight:400;margin:0}.count{font-size:12px;color:var(--sub);white-space:nowrap}.board{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:14px;align-items:start;padding-bottom:50px}.stack{border-top:2px solid var(--ink);min-height:330px;background:#fafafa}.stack-head{display:flex;align-items:baseline;justify-content:space-between;gap:5px;padding:16px 14px 17px}.stack-head h3{margin:0;font-size:12px;font-weight:600;letter-spacing:-.01em}.stack-head span{font-size:12px;color:var(--sub)}.stack-body{padding:0 9px 12px;min-height:250px}.stack.over{background:#f0f0ed}.card{background:#fff;border:1px solid var(--rule);padding:13px 13px 12px;margin-bottom:8px;touch-action:auto;cursor:grab}.card:hover{border-color:var(--ink)}.card.dragging{opacity:.3}.card-top{display:flex;align-items:flex-start;gap:5px;justify-content:space-between}.card-name{font-weight:600;line-height:1.35;overflow-wrap:anywhere;text-decoration:none}.card-name:hover{text-decoration:underline}.grip{flex:none;color:#999;border:0;background:none;padding:0 0 5px 8px;font-size:20px;line-height:16px;touch-action:none;cursor:grab;user-select:none}.grip:active{cursor:grabbing} .card.touch-drag{touch-action:none}.meta{color:var(--sub);font-size:11px;line-height:1.45;margin-top:9px;overflow-wrap:anywhere}.aum{margin-top:13px;font-size:15px;font-family:Georgia,serif}.card-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:14px}.stage-select{font-size:11px;border:1px solid var(--rule);background:#fff;color:var(--ink);padding:6px;max-width:100%;border-radius:0}.remove{border:0;background:none;color:var(--sub);font-size:18px;padding:2px 6px}.remove:hover{color:var(--ink)}.empty{color:#999;font-size:12px;padding:20px 5px;text-align:center}.drag-ghost{position:fixed;pointer-events:none;z-index:100;box-shadow:0 14px 30px #0002;opacity:.96;width:240px;transform:rotate(1deg)}.picker{position:fixed;inset:0;z-index:60;background:#0005;display:none;align-items:center;justify-content:center;padding:18px}.picker.show{display:flex}.pick-panel{background:white;width:min(520px,100%);max-height:min(620px,85dvh);display:flex;flex-direction:column;border:1px solid var(--ink)}.pick-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--rule);padding:16px 19px}.pick-head h2{margin:0;font-size:17px;font-weight:600}.close{background:white;border:0;font-size:24px;line-height:1;padding:0 2px}.pick-search{width:calc(100% - 38px);margin:18px 19px 11px;padding:11px 12px;border:1px solid var(--rule);outline:0;font-size:16px;border-radius:0}.pick-list{overflow:auto;padding:0 19px 18px;overscroll-behavior:contain}.pick-row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:white;border:0;border-bottom:1px solid var(--rule);text-align:left;padding:12px 0;min-height:54px}.pick-row:hover,.pick-row:focus{background:var(--soft)}.pick-row strong{font-size:13px;display:block;line-height:1.3}.pick-row small{font-size:11px;color:var(--sub);display:block;margin-top:3px}.pick-row b{font-size:20px;font-weight:400}.pick-row:disabled{color:#999;cursor:default}.pick-row:disabled b{font-size:11px}.feedback{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 15px;opacity:0;pointer-events:none;transition:opacity .18s;z-index:90;font-size:12px}.feedback.show{opacity:1}@media(max-width:1000px){.board{display:flex;overflow-x:auto;scroll-snap-type:x proximity;gap:12px;margin:0 -28px;padding:0 28px 40px;overscroll-behavior-inline:contain}.stack{flex:0 0 250px;scroll-snap-align:start;min-height:58vh}.board::-webkit-scrollbar{height:5px}.board::-webkit-scrollbar-thumb{background:#ccc}}@media(max-width:600px){.shell{padding:0 16px}.top-inner{min-height:68px;gap:12px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}.brand{font-size:21px}.divider{height:17px}.top h1{font-size:14px}.actions{flex-basis:100%;margin-left:0;gap:8px}.search{flex:1;width:auto;height:42px;font-size:16px}.add{width:42px;height:42px}.heading{padding:24px 0 19px}.heading h2{font-size:27px}.board{margin:0 -16px;padding:0 16px 32px}.stack{flex-basis:min(82vw,310px)}.picker{align-items:flex-end;padding:0}.pick-panel{width:100%;max-height:83dvh;min-height:60dvh;border-left:0;border-right:0;border-bottom:0;padding-bottom:env(safe-area-inset-bottom)}}
.auth{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}.auth button{border:1px solid var(--ink);background:white;min-height:38px;padding:0 12px}.auth input{width:220px;height:38px;border:1px solid var(--rule);padding:0 9px;font-size:14px}.auth small{color:var(--sub)}.auth.error{color:#a31b1b}.auth input:focus{outline:1px solid var(--ink)}.auth button:disabled{opacity:.5;cursor:default}@media(max-width:600px){.auth{margin:0 0 2px;width:100%}.auth input{flex:1;min-width:0;font-size:16px}.auth button{min-height:42px}}
</style></head><body>
<header class="top"><div class="shell top-inner"><a class="brand" href="index.html" aria-label="LP Globe home">LP GLOBE</a><span class="divider"></span><h1>Pipeline</h1><div class="actions"><input class="search" id="board-search" type="search" placeholder="Search cards" aria-label="Search cards"><button class="add" id="add" type="button" aria-label="Add LP">+</button></div></div></header>
<main class="shell"><div class="heading"><h2>LP pipeline</h2><div class="auth" id="auth" aria-live="polite"><small>Connecting…</small></div><span class="count" id="total"></span></div><div class="board" id="board" aria-label="LP pipeline board"></div></main>
<div class="picker" id="picker" role="dialog" aria-modal="true" aria-labelledby="pick-title"><div class="pick-panel"><div class="pick-head"><h2 id="pick-title">Add an LP</h2><button class="close" id="close" type="button" aria-label="Close">×</button></div><input id="pick-search" class="pick-search" type="search" placeholder="Search LP Globe" aria-label="Search LP Globe firms"><div id="pick-list" class="pick-list"></div></div></div><div class="feedback" id="feedback" role="status"></div>
<script>let firms=[];</script><script src="firms-data.js"></script><script src="supabase-bundle.js"></script><script>
(function(){'use strict';
const stages=['Contacted','First meeting','Starting diligence','Final process','Committed'];
const sections=['Historic Institutions','Historic Individuals','Historic Legacies','Other'];const institution=new Set(['endowment']),individual=new Set(['family office','sfo','hnw','private investment office']),legacy=new Set(['foundation','philanthropic llc']);const overrides={'The Museum of Modern Art':0,'Indiana University Foundation':0,'University of Illinois Foundation':0,'Georgia Tech Foundation':0,'University of Massachusetts Foundation':0,'Purdue Research Foundation':0,'The California Endowment':2,'Chan Zuckerberg Initiative (investment office)':2,'Cleveland Clinic':3,'Mayo Clinic':3,'Memorial Sloan Kettering Cancer Center':3,'Boston Children\'s Hospital':3,'Children\'s Healthcare of Atlanta':3,'Children\'s Hospital Los Angeles (CHLA)':3,'Children\'s Hospital of Philadelphia (CHOP)':3,'Dana-Farber Cancer Institute':3,'Hackensack Meridian Health':3,'NewYork-Presbyterian Office of Investments':3,'Texas Children\'s Hospital':3,'Mass General Brigham Investment Office':3,'Sequoia Heritage':3,'Global Endowment Management (GEM)':3,'Bilt':3,'Harlem Children\'s Zone (endowment)':3,'Council on Foreign Relations (endowment)':3,'Texas':3,'The Nature Conservancy':3};function category(f){const t=(f.type||'').toLowerCase();return sections[overrides[f.name]??(institution.has(t)?0:individual.has(t)?1:legacy.has(t)?2:3)]} 
const $=id=>document.getElementById(id);const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={pipeline:{}};let session=null;let loading=true;let saving=false;const db=window.lpSupabase;
const savedLocal=(()=>{try{return JSON.parse(localStorage.getItem('lp-globe-v1')||'{}')?.pipeline||{}}catch(e){return {}}})();
function setStatus(msg,error=false){$('auth').classList.toggle('error',error);$('auth').innerHTML='<small>'+esc(msg)+'</small>'}
function authUI(){if(session){$('auth').classList.remove('error');$('auth').innerHTML='<small>'+esc(session.user.email||'Signed in')+'</small><button id="signout" type="button">Sign out</button>';$('signout').onclick=()=>db.auth.signOut()}else{ $('auth').innerHTML='<input id="auth-email" type="email" autocomplete="email" placeholder="Your email" aria-label="Email for sign-in"><button id="signin" type="button">Email sign-in link</button>';$('signin').onclick=async()=>{const e=$('auth-email').value.trim().toLowerCase();if(e!=='zakaria.m.gedi@gmail.com'){notice('Use the LP Globe owner email');return}setStatus('Sending link…');const {error}=await db.auth.signInWithOtp({email:e,options:{emailRedirectTo:'https://zakgedi.github.io/lp-globe/pipeline.html'}});if(error){authUI();notice('Sign-in failed: '+error.message)}else setStatus('Check your email for the sign-in link')};}}
async function loadPipeline(){if(!session){state.pipeline={};loading=false;render();return}loading=true;render();const {data,error}=await db.from('lp_pipeline').select('firm_id,stage');loading=false;if(error){setStatus('Could not load pipeline',true);notice(error.message);return}state.pipeline=Object.fromEntries(data.map(row=>[row.firm_id,row.stage]));render();
 if(Object.keys(savedLocal).length&&!localStorage.getItem('lp-globe-pipeline-migrated')){let n=0;for(const [id,stage] of Object.entries(savedLocal)){if(state.pipeline[id]||!firms[+id]||!stages.includes(stage))continue;const {error:e}=await db.from('lp_pipeline').upsert({firm_id:+id,stage},{onConflict:'firm_id'});if(e){notice('Some local cards could not sync');break}state.pipeline[id]=stage;n++}localStorage.setItem('lp-globe-pipeline-migrated','1');if(n)notice(n+' local cards synced');render()}
}
function save(id,stage){if(!session||loading||saving){notice('Wait for the pipeline to finish loading');return false}const old=state.pipeline[id];if(stage===null)delete state.pipeline[id];else state.pipeline[id]=stage;saving=true;render();(async()=>{let response=stage===null?await db.from('lp_pipeline').delete().eq('firm_id',+id):await db.from('lp_pipeline').upsert({firm_id:+id,stage},{onConflict:'firm_id'});saving=false;if(response.error){if(old===undefined)delete state.pipeline[id];else state.pipeline[id]=old;render();notice('Not saved: '+response.error.message)}else{render();notice(stage===null?'Removed':'Saved to pipeline')}})();return true}
(async()=>{try{const {data,error}=await db.auth.getSession();if(error)throw error;session=data.session;authUI();await loadPipeline();db.auth.onAuthStateChange(async(evt,ss)=>{if(evt==='INITIAL_SESSION')return;session=ss;authUI();await loadPipeline()})}catch(e){loading=false;setStatus('Could not connect. Reload the page.',true);notice(e.message)}})();
function notice(s){$('feedback').textContent=s;$('feedback').classList.add('show');clearTimeout(notice.t);notice.t=setTimeout(()=>$('feedback').classList.remove('show'),2300)}
function records(){return Object.entries(state.pipeline).filter(([id,stage])=>Number.isInteger(+id)&&firms[+id]&&stages.includes(stage))}
function render(){const q=$('board-search').value.trim().toLowerCase();const all=records();$('add').disabled=!session||loading||saving;$('board-search').disabled=!session||loading;$('total').textContent=all.length+' LP'+(all.length===1?'':'s');$('board').innerHTML=stages.map(stage=>{const cards=all.filter(([id,s])=>s===stage&&(!q||[firms[+id].name,firms[+id].type,firms[+id].location,...(firms[+id].contacts||[]).map(c=>c.name)].some(x=>String(x||'').toLowerCase().includes(q))));return '<section class="stack" data-stage="'+stage+'"><div class="stack-head"><h3>'+stage+'</h3><span>'+cards.length+'</span></div><div class="stack-body">'+(cards.length?cards.map(([id])=>{const f=firms[+id];return '<article class="card" draggable="true" data-id="'+id+'" tabindex="0" aria-label="'+esc(f.name)+', '+category(f)+', '+esc(f.aum||'AUM unknown')+'; drag to move or use arrow keys"><div class="card-top"><a class="card-name" href="index.html#/firm/'+id+'">'+esc(f.name)+'</a><button class="grip" type="button" aria-label="Drag '+esc(f.name)+'">⋮⋮</button></div><div class="meta">'+category(f)+'</div><div class="aum">'+esc(f.aum||'AUM unknown')+'</div></article>'}).join(''):'<div class="empty">'+(loading?'Loading…':!session?'Sign in to view pipeline':q?'No matches':'Drop LPs here')+'</div>')+'</div></section>'}).join('')}
function picker(){const q=$('pick-search').value.trim().toLowerCase();const matches=firms.map((f,id)=>({f,id})).filter(({f})=>!q||[f.name,f.type,f.location,...(f.contacts||[]).map(c=>c.name)].some(x=>String(x||'').toLowerCase().includes(q))).slice(0,60);$('pick-list').innerHTML=matches.length?matches.map(({f,id})=>'<button class="pick-row" type="button" data-add="'+id+'" '+(state.pipeline[id]?'':'')+'><span><strong>'+esc(f.name)+'</strong><small>'+esc([f.type,f.location].filter(Boolean).join(' · '))+'</small></span><b>'+(state.pipeline[id]?'Remove':'+')+'</b></button>').join(''):'<div class="empty">No LPs match</div>'}
function open(){if(!session||loading||saving)return; $('picker').classList.add('show');$('pick-search').value='';picker();$('pick-search').focus() }function close(){ $('picker').classList.remove('show');$('add').focus() }
$('add').onclick=open;$('close').onclick=close;$('picker').addEventListener('pointerdown',e=>{if(e.target===$('picker'))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('picker').classList.contains('show'))close()});$('pick-search').oninput=picker;$('board-search').oninput=render;
$('pick-list').onclick=e=>{const b=e.target.closest('[data-add]');if(!b)return;const id=b.dataset.add;if(state.pipeline[id]){if(save(id,null))close()}else{if(save(id,stages[0]))close()}};
$('board').addEventListener('keydown',e=>{const c=e.target.closest('.card');if(!c||e.target!==c||!['ArrowRight','ArrowLeft'].includes(e.key))return;e.preventDefault();const id=c.dataset.id;const n=stages.indexOf(state.pipeline[id])+(e.key==='ArrowRight'?1:-1);if(n<0||n>=stages.length)return;if(!save(id,stages[n]))return;document.querySelector('.card[data-id="'+id+'"]')?.focus();notice('Moved to '+stages[n])});
let dragId=null;$('board').addEventListener('dragstart',e=>{const c=e.target.closest('.card');if(!c)return;dragId=c.dataset.id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId);setTimeout(()=>c.classList.add('dragging'),0)});$('board').addEventListener('dragover',e=>{const s=e.target.closest('.stack');if(s){e.preventDefault();e.dataTransfer.dropEffect='move';document.querySelectorAll('.stack.over').forEach(x=>x.classList.remove('over'));s.classList.add('over')}});$('board').addEventListener('drop',e=>{const s=e.target.closest('.stack');if(!s)return;e.preventDefault();const id=dragId||e.dataTransfer.getData('text/plain');if(session&&!saving&&state.pipeline[id]&&s.dataset.stage!==state.pipeline[id]){save(id,s.dataset.stage)}else document.querySelectorAll('.stack.over').forEach(x=>x.classList.remove('over'));dragId=null});$('board').addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.stack.over,.card.dragging').forEach(x=>x.classList.remove('over','dragging'))});
let touch=null;$('board').addEventListener('pointerdown',e=>{const grip=e.target.closest('.grip');if(!grip||e.pointerType==='mouse')return;e.preventDefault();const card=grip.closest('.card');touch={id:card.dataset.id,x:e.clientX,y:e.clientY,ghost:null};card.classList.add('touch-drag');grip.setPointerCapture(e.pointerId)});$('board').addEventListener('pointermove',e=>{if(!touch)return;e.preventDefault();if(!touch.ghost&&Math.hypot(e.clientX-touch.x,e.clientY-touch.y)>5){touch.ghost=document.querySelector('.card[data-id="'+touch.id+'"]').cloneNode(true);touch.ghost.classList.add('drag-ghost');document.body.append(touch.ghost)}if(touch.ghost){const viewport=$('board').getBoundingClientRect();if(e.clientX>viewport.right-35)$('board').scrollLeft+=25;else if(e.clientX<viewport.left+35)$('board').scrollLeft-=25;touch.ghost.style.left=(e.clientX-100)+'px';touch.ghost.style.top=(e.clientY-35)+'px';document.querySelectorAll('.stack.over').forEach(x=>x.classList.remove('over'));const hitX=Math.max(viewport.left+1,Math.min(viewport.right-1,e.clientX));const under=document.elementFromPoint(hitX,e.clientY)?.closest('.stack');if(under)under.classList.add('over')}});function finish(e){if(!touch)return;const viewport=$('board').getBoundingClientRect();const hitX=Math.max(viewport.left+1,Math.min(viewport.right-1,e.clientX));const s=document.elementFromPoint(hitX,e.clientY)?.closest('.stack');touch.ghost?.remove();document.querySelector('.card.touch-drag')?.classList.remove('touch-drag');if(session&&!saving&&s&&s.dataset.stage!==state.pipeline[touch.id]){save(touch.id,s.dataset.stage)}else document.querySelectorAll('.stack.over').forEach(x=>x.classList.remove('over'));touch=null}$('board').addEventListener('pointerup',finish);$('board').addEventListener('pointercancel',finish);
render();
})();
</script></body></html>
