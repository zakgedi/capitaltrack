<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>Pipeline · LP Globe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #141414;
        --sub: #666;
        --rule: #dedede;
        --soft: #f6f6f5;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #fff;
        color: var(--ink);
      }
      body {
        font-family: Arial, Helvetica, sans-serif;
        -webkit-font-smoothing: antialiased;
        font-size: 14px;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
        border-radius: 0;
      }
      a {
        color: inherit;
      }
      .shell {
        max-width: 1680px;
        margin: auto;
        padding: 0 28px;
      }
      .top {
        border-bottom: 1px solid var(--ink);
      }
      .top-inner {
        min-height: 76px;
        display: flex;
        align-items: center;
        gap: 23px;
      }
      .brand {
        font-family: Georgia, serif;
        letter-spacing: -0.055em;
        font-size: 24px;
        font-weight: 600;
        text-decoration: none;
        white-space: nowrap;
      }
      .divider {
        height: 23px;
        width: 1px;
        background: var(--rule);
      }
      h1 {
        font-size: 15px;
        letter-spacing: -0.025em;
        margin: 0;
        font-weight: 600;
      }
      .actions {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .search {
        border: 1px solid var(--rule);
        width: 230px;
        height: 38px;
        padding: 0 12px;
        outline: 0;
        border-radius: 0;
        min-width: 0;
      }
      .search:focus,
      .pick-search:focus {
        border-color: var(--ink);
      }
      .add {
        height: 38px;
        min-width: 38px;
        border: 1px solid var(--ink);
        background: var(--ink);
        color: white;
        font-size: 23px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .add:hover {
        background: #333;
      }
      .heading {
        padding-top: 30px;
        padding-bottom: 22px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
      }
      .heading h2 {
        font-family: Georgia, serif;
        font-size: 30px;
        letter-spacing: -0.04em;
        font-weight: 400;
        margin: 0;
      }
      .count {
        font-size: 12px;
        color: var(--sub);
        white-space: nowrap;
      }
      .board {
        display: grid;
        grid-template-columns: repeat(7, minmax(190px, 1fr));
        gap: 14px;
        align-items: start;
        padding-bottom: 50px;
      }
      .stack {
        border-top: 2px solid var(--ink);
        min-height: 330px;
        background: #fafafa;
      }
      .stack-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 5px;
        padding: 16px 14px 17px;
      }
      .stack-head h3 {
        margin: 0;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .stack-head span {
        font-size: 12px;
        color: var(--sub);
      }
      .stack-body {
        padding: 0 9px 12px;
        min-height: 250px;
      }
      .stack-head button { border: 0; background: transparent; font-weight: 600; font-size: 12px; padding: 5px 3px; margin: -5px 0; text-align: left; }
      .stack-head button:hover { text-decoration: underline; text-underline-offset: 3px; }
      .stack-head button:focus-visible, .stack-body:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
      .stack-body { cursor: pointer; }
      .stack-body .card { cursor: grab; }
      .stack.over {
        background: #f0f0ed;
      }
      .card {
        background: #fff;
        border: 1px solid var(--rule);
        padding: 13px 13px 12px;
        margin-bottom: 8px;
        touch-action: auto;
        cursor: grab;
      }
      .card:hover {
        border-color: var(--ink);
      }
      .card.dragging {
        opacity: 0.3;
      }
      .card-top {
        display: flex;
        align-items: flex-start;
        gap: 5px;
        justify-content: space-between;
      }
      .card-name {
        font-weight: 600;
        line-height: 1.35;
        overflow-wrap: anywhere;
        text-decoration: none;
      }
      .card-name:hover {
        text-decoration: underline;
      }
      .grip {
        flex: none;
        color: #999;
        border: 0;
        background: none;
        padding: 0 0 5px 8px;
        font-size: 20px;
        line-height: 16px;
        touch-action: none;
        cursor: grab;
        user-select: none;
      }
      .grip:active {
        cursor: grabbing;
      }
      .card.touch-drag {
        touch-action: none;
      }
      .meta {
        color: var(--sub);
        font-size: 11px;
        line-height: 1.45;
        margin-top: 9px;
        overflow-wrap: anywhere;
      }
      .aum {
        margin-top: 13px;
        font-size: 15px;
        font-family: Georgia, serif;
      }
      .tier-pill { display: inline-flex; align-items: center; justify-content: center; min-width: 27px; padding: 4px 6px; border: 1px solid #242424; font: 700 11px/1 Arial, sans-serif; color: #242424; background: #f8f6ef; flex: none; }
      .card-rank { display: flex; align-items: center; gap: 8px; margin-top: 9px; font: 11px/1.3 Arial, sans-serif; color: var(--sub); }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 12px;
      }
      .tag-chip {
        display: inline-flex;
        align-items: center;
        max-width: 100%;
        padding: 3px 7px;
        font:
          600 10px/1.4 Arial,
          sans-serif;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        border: 1px solid currentColor;
      }
      .tag-chip.slate {
        color: #4b5563;
        background: #f3f4f6;
      }
      .tag-chip.blue {
        color: #1d4e8f;
        background: #eaf2fc;
      }
      .tag-chip.teal {
        color: #116b70;
        background: #e4f4f3;
      }
      .tag-chip.green {
        color: #2d6738;
        background: #e8f5e9;
      }
      .tag-chip.amber {
        color: #805300;
        background: #fff2d2;
      }
      .tag-chip.orange {
        color: #9b4300;
        background: #fff0e3;
      }
      .tag-chip.rose {
        color: #963b55;
        background: #fbeaf0;
      }
      .tag-chip.violet {
        color: #69468b;
        background: #f1ebf8;
      }
      .tag-open {
        border: 0;
        background: transparent;
        color: #666;
        font-size: 11px;
        text-decoration: underline;
        text-underline-offset: 3px;
        padding: 7px 0 0;
      }
      .tag-open:hover {
        color: #141414;
      }
      .tag-toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        margin: 0 0 16px;
        flex-wrap: wrap;
      }
      .tag-toolbar select,
      .tag-toolbar button {
        border: 1px solid var(--rule);
        background: #fff;
        height: 34px;
        padding: 0 10px;
        font-size: 12px;
      }
      .tag-toolbar button:hover {
        border-color: var(--ink);
      }
      .tag-list {
        overflow-y: auto;
        padding: 7px 19px;
        min-height: 90px;
      }
      .tag-row {
        display: flex;
        gap: 9px;
        align-items: center;
        border-bottom: 1px solid var(--rule);
        padding: 9px 0;
      }
      .tag-row .tag-chip {
        margin-right: auto;
      }
      .tag-row button {
        border: 1px solid var(--rule);
        background: white;
        min-width: 34px;
        min-height: 34px;
        padding: 0 9px;
      }
      .tag-row button:hover {
        border-color: var(--ink);
      }
      .tag-create {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        padding: 15px 19px;
        border-top: 1px solid var(--rule);
      }
      .tag-create input {
        min-width: 120px;
        flex: 1;
        border: 1px solid var(--rule);
        height: 40px;
        padding: 0 10px;
        font-size: 16px;
      }
      .tag-create select {
        border: 1px solid var(--rule);
        height: 40px;
        padding: 0 6px;
        background: #fff;
      }
      .tag-create button {
        height: 40px;
        border: 1px solid var(--ink);
        background: #141414;
        color: white;
        padding: 0 15px;
      }
      .palette {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .palette button {
        width: 24px;
        height: 24px;
        padding: 0;
        border: 1px solid #999;
        outline-offset: 2px;
      }
      .palette button.active {
        outline: 2px solid #141414;
      }
      .palette button.slate {
        background: #f3f4f6;
      }
      .palette button.blue {
        background: #8ebbe9;
      }
      .palette button.teal {
        background: #73c8bc;
      }
      .palette button.green {
        background: #9bd6a1;
      }
      .palette button.amber {
        background: #f5d37e;
      }
      .palette button.orange {
        background: #f2ae79;
      }
      .palette button.rose {
        background: #eba1b5;
      }
      .palette button.violet {
        background: #c4a8e3;
      }
      .card-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        margin-top: 14px;
      }
      .stage-select {
        font-size: 11px;
        border: 1px solid var(--rule);
        background: #fff;
        color: var(--ink);
        padding: 6px;
        max-width: 100%;
        border-radius: 0;
      }
      .remove {
        border: 0;
        background: none;
        color: var(--sub);
        font-size: 18px;
        padding: 2px 6px;
      }
      .remove:hover {
        color: var(--ink);
      }
      .empty {
        color: #999;
        font-size: 12px;
        padding: 20px 5px;
        text-align: center;
      }
      .drag-ghost {
        position: fixed;
        pointer-events: none;
        z-index: 100;
        box-shadow: 0 14px 30px #0002;
        opacity: 0.96;
        width: 240px;
        transform: rotate(1deg);
      }
      .picker {
        position: fixed;
        inset: 0;
        z-index: 60;
        background: #0005;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 18px;
      }
      .picker.show {
        display: flex;
      }
      .pick-panel {
        background: white;
        width: min(520px, 100%);
        max-height: min(620px, 85dvh);
        display: flex;
        flex-direction: column;
        border: 1px solid var(--ink);
      }
      .pick-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--rule);
        padding: 16px 19px;
      }
      .pick-head h2 {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
      }
      .close {
        background: white;
        border: 0;
        font-size: 24px;
        line-height: 1;
        padding: 0 2px;
      }
      .pick-search {
        width: calc(100% - 38px);
        margin: 18px 19px 11px;
        padding: 11px 12px;
        border: 1px solid var(--rule);
        outline: 0;
        font-size: 16px;
        border-radius: 0;
      }
      .pick-stage-label { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 19px 12px; font-size: 12px; font-weight: 600; }
      .pick-stage-label select { flex: 1; max-width: 230px; padding: 9px 10px; border: 1px solid var(--rule); background: #fff; border-radius: 0; font-size: 16px; }
      .pick-list-title { margin: 3px 19px 6px; font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--sub); }
      .pick-list { flex: 1; min-height: 0;
        overflow: auto;
        padding: 0 19px 18px;
        overscroll-behavior: contain;
      }
      .pick-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        width: 100%;
        background: white;
        border: 0;
        border-bottom: 1px solid var(--rule);
        text-align: left;
        padding: 12px 0;
        min-height: 54px;
      }
      .pick-row:hover,
      .pick-row:focus {
        background: var(--soft);
      }
      .pick-row strong {
        font-size: 13px;
        display: block;
        line-height: 1.3;
      }
      .pick-row small {
        font-size: 11px;
        color: var(--sub);
        display: block;
        margin-top: 3px;
      }
      .pick-row b {
        font-size: 20px;
        font-weight: 400;
      }
      .pick-row:disabled {
        color: #999;
        cursor: default;
      }
      .pick-row:disabled b {
        font-size: 11px;
      }
      .feedback {
        position: fixed;
        bottom: calc(20px + env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        background: var(--ink);
        color: #fff;
        padding: 10px 15px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.18s;
        z-index: 90;
        font-size: 12px;
      }
      .feedback.show {
        opacity: 1;
      }
      @media (min-width: 1001px) {
        .board { overflow-x: auto; grid-template-columns: repeat(7, minmax(210px, 1fr)); padding-bottom: 28px; }
      }
      @media (min-width: 601px) and (max-width: 1000px) {
        .board {
          gap: 14px;
        }
        .stack {
          flex: 0 0 min(31vw, 285px);
        }
        .heading {
          padding-top: 25px;
        }
      }
      @media (max-width: 1000px) {
        .board {
          display: flex;
          overflow-x: auto;
          scroll-snap-type: x proximity;
          gap: 12px;
          margin: 0 -28px;
          padding: 0 28px 40px;
          overscroll-behavior-inline: contain;
        }
        .stack {
          flex: 0 0 250px;
          scroll-snap-align: start;
          min-height: 58vh;
        }
        .board::-webkit-scrollbar {
          height: 5px;
        }
        .board::-webkit-scrollbar-thumb {
          background: #ccc;
        }
      }
      @media (max-width: 600px) {
        .shell {
          padding: 0 16px;
        }
        .top-inner {
          min-height: 68px;
          gap: 12px;
          flex-wrap: wrap;
          padding-top: 12px;
          padding-bottom: 12px;
        }
        .brand {
          font-size: 21px;
        }
        .divider {
          height: 17px;
        }
        .top h1 {
          font-size: 14px;
        }
        .actions {
          flex-basis: 100%;
          margin-left: 0;
          gap: 8px;
        }
        .search {
          flex: 1;
          width: auto;
          height: 42px;
          font-size: 16px;
        }
        .add {
          width: 42px;
          height: 42px;
        }
        .heading {
          padding: 24px 0 19px;
          gap: 12px;
        }
        .heading h2 {
          font-size: 27px;
          flex: 1;
        }
        .heading .count {
          order: 2;
        }
        .heading .auth {
          order: 3;
          flex-basis: 100%;
        }
        .pane-nav {
          margin-left: 0;
        }
        .pane-nav a {
          padding: 7px 9px;
        }
        .board {
          margin: 0 -16px;
          padding: 0 16px 32px;
        }
        .stack {
          flex-basis: min(82vw, 310px);
        }
        .picker {
          align-items: flex-end;
          padding: 0;
        }
        .pick-panel {
          width: 100%;
          max-height: 83dvh;
          min-height: 60dvh;
          border-left: 0;
          border-right: 0;
          border-bottom: 0;
          padding-bottom: env(safe-area-inset-bottom);
        }
      }
      .card-detail {
        font-size: 11px;
        line-height: 1.5;
        color: var(--sub);
        margin-top: 8px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .card-detail strong {
        color: var(--ink);
      }
      .card-edit {
        border: 1px solid var(--rule);
        background: #fff;
        padding: 6px 9px;
        font-size: 11px;
        margin-top: 12px;
      }
      .card-edit:hover {
        border-color: var(--ink);
      }
      .card-form {
        overflow: auto;
        padding: 18px 19px;
        display: grid;
        gap: 16px;
      }
      .card-form label {
        display: grid;
        gap: 7px;
        font-size: 12px;
        font-weight: 600;
      }
      .card-form input,
      .card-form textarea,
      .card-form select {
        border: 1px solid var(--rule);
        border-radius: 0;
        padding: 10px;
        font-size: 16px;
        background: #fff;
        color: var(--ink);
        width: 100%;
      }
      .card-form textarea {
        min-height: 130px;
        resize: vertical;
      }
      .card-form .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      .card-form .form-actions button {
        padding: 10px 16px;
        background: #fff;
        border: 1px solid var(--rule);
      }
      .card-form .form-actions button[type="submit"] {
        background: var(--ink);
        color: #fff;
        border-color: var(--ink);
      }
      .card-tag-options {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }
      .card-tag-options label {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        border: 1px solid var(--rule);
        padding: 6px 8px;
        font-size: 12px;
        font-weight: 400;
      }
      .card-tag-options input {
        width: auto;
        margin: 0;
      }
      .card-tag-create {
        display: flex;
        gap: 7px;
        margin-top: 10px;
        align-items: center;
      }
      .card-form .card-tag-create input {
        flex: 1 1 0;
        width: auto;
        min-width: 0;
      }
      .card-form .card-tag-create select,
      .card-form .card-tag-create .bb-custom-select-container {
        width: 92px;
        flex: 0 0 92px;
        min-width: 0;
      }
      .card-form .card-tag-create .bb-custom-select-opener {
        min-width: 0;
      }
      .card-tag-create button {
        min-height: 40px;
        padding: 0 12px;
        border: 1px solid var(--ink);
        background: #fff;
        white-space: nowrap;
      }
      @media (max-width: 480px) {
        .card-tag-create {
          flex-wrap: wrap;
        }
        .card-form .card-tag-create input {
          flex-basis: 100%;
        }
      }
      .pane-nav {
        display: flex;
        gap: 0;
        margin-left: 8px;
      }
      .pane-nav a {
        padding: 9px 12px;
        border: 1px solid var(--rule);
        font-size: 12px;
        text-decoration: none;
      }
      .pane-nav a[aria-current="page"] {
        background: var(--ink);
        color: #fff;
        border-color: var(--ink);
      }
      .auth {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-left: auto;
      }
      .auth button {
        border: 1px solid var(--ink);
        background: white;
        min-height: 38px;
        padding: 0 12px;
      }
      .auth input {
        width: 220px;
        height: 38px;
        border: 1px solid var(--rule);
        padding: 0 9px;
        font-size: 14px;
      }
      .auth small {
        color: var(--sub);
      }
      .auth.error {
        color: #a31b1b;
      }
      .auth input:focus {
        outline: 1px solid var(--ink);
      }
      .auth button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      @media (max-width: 600px) {
        .auth {
          margin: 0 0 2px;
          width: 100%;
        }
        .auth input {
          flex: 1;
          min-width: 0;
          font-size: 16px;
        }
        .auth button {
          min-height: 42px;
        }
      }
      .pane-nav a:focus-visible, .brand:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

      /* Shared LP Globe shell: same type, line work and controls on both pages. */
      body { font-family: 'Newsreader', Georgia, serif; font-size: 15px; }
      .top { border-bottom-color: var(--rule); }
      .top-inner { min-height: 64px; gap: 12px; }
      .brand { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: .09em; }
      .divider { height: 22px; }
      .pane-nav { margin-left: 0; gap: 4px; }
      .pane-nav a { border: 1px solid transparent; padding: 9px 12px; font: 600 11px/1 Arial, Helvetica, sans-serif; letter-spacing: .07em; text-transform: uppercase; }
      .pane-nav a:hover, .pane-nav a[aria-current="page"] { border-color: var(--ink); background: #fff; color: var(--ink); }
      .actions { gap: 8px; }
      .search { font: 14px 'Newsreader', Georgia, serif; border: 0; border-bottom: 1px solid #777; padding: 0 8px; background: #fff; width: min(220px, 20vw); }
      .add { background: #fff; color: var(--ink); font: 20px Arial, sans-serif; border-color: #aaa; }
      .add:hover { background: #f7f6f2; }
      .heading h2 { font-size: 29px; }
      .heading { padding-top: 25px; padding-bottom: 15px; }
      .tag-toolbar { font-family: Arial, Helvetica, sans-serif; font-size: 11px; }
      .board { grid-template-columns: repeat(6, minmax(195px, 1fr)); gap: 12px; }

      /* Card face: one lead, one quiet status line, one tag line. */

      .card-rank { margin-top: 15px; gap: 9px; font: 11px/1.3 Arial, Helvetica, sans-serif; color: #696966; }
      .card-rank .tier-pill { min-width: 0; padding: 0; border: 0; background: transparent; color: var(--ink); font: 700 11px/1.3 Arial, sans-serif; }
      .card-rank .tier-pill[data-tier="S"] { color: #946b16; }

      .card .tag-chip { border: 0; padding: 0; background: none; color: #696966; font: 10px/1.4 Arial, Helvetica, sans-serif; }
      .card .tag-chip::before { content: ''; display: inline-block; width: 5px; height: 5px; margin-right: 6px; vertical-align: 1px; background: var(--tag-color, #888); }
      .card .tag-chip.slate { --tag-color: #4b5563; }

      /* A viewport-width board with wide, compact cards. */

        <label class="pick-stage-label">Stack<select id="pick-stage" aria-label="Stack for new LP"></select></label>

          ><label>Tier<select id="card-tier" aria-label="LP tier">
              <option value="">Unranked</option><option value="S">S tier</option><option value="A">A tier</option><option value="B">B tier</option><option value="C">C tier</option><option value="D">D tier</option><option value="F">F tier</option>
          </select></label><label

    <div class="feedback" id="feedback" role="status"></div>
    <script>
      let firms = [];
    </script>
    <script src="firms-lite.js"></script>
    <script src="auth-lite.js"></script>
    <script>
      (function () {
        "use strict";
        const stages = [
          "Wishlist",
          "Warm",
          "Contacted",
          "In Process",
          "Committed",
        ];
        const sections = [
          "Historic Institutions",
          "Historic Individuals",
          "Historic Legacies",
          "Other",
        ];
        const institution = new Set(["endowment"]),
          individual = new Set([
            "family office",
            "sfo",
            "hnw",
            "private investment office",
          ]),
          legacy = new Set(["foundation", "philanthropic llc"]);
        const overrides = {
          "The Museum of Modern Art": 0,
          "Indiana University Foundation": 0,
          "University of Illinois Foundation": 0,
          "Georgia Tech Foundation": 0,
          "University of Massachusetts Foundation": 0,
          "Purdue Research Foundation": 0,
          "The California Endowment": 2,
          "Chan Zuckerberg Initiative (investment office)": 2,
          "Cleveland Clinic": 3,
          "Mayo Clinic": 3,
          "Memorial Sloan Kettering Cancer Center": 3,
          "Boston Children's Hospital": 3,
          "Children's Healthcare of Atlanta": 3,
          "Children's Hospital Los Angeles (CHLA)": 3,
          "Children's Hospital of Philadelphia (CHOP)": 3,
          "Dana-Farber Cancer Institute": 3,
          "Hackensack Meridian Health": 3,
          "NewYork-Presbyterian Office of Investments": 3,
          "Texas Children's Hospital": 3,
          "Mass General Brigham Investment Office": 3,
          "Sequoia Heritage": 3,
          "Global Endowment Management (GEM)": 3,
          Bilt: 3,
          "Harlem Children's Zone (endowment)": 3,
          "Council on Foreign Relations (endowment)": 3,
          Texas: 3,
          "The Nature Conservancy": 3,
        };
        function category(f) {
          const t = (f.type || "").toLowerCase();
          return sections[
            overrides[f.name] ??
              (institution.has(t)
                ? 0
                : individual.has(t)
                  ? 1
                  : legacy.has(t)
                    ? 2
                    : 3)
          ];
        }
        const $ = (id) => document.getElementById(id);
        const esc = (s) =>
          String(s == null ? "" : s).replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          );
        let state = { pipeline: {}, details: {}, tags: [], cardTags: [] };
        let selectedStage = stages[0];
        let profiles = null;
        let detailFirm = null;
        let detailReturn = null;
        let cardFirm = null;
        let cardIsNew = false;
        let activeFirm = null;
        let editTagId = null;
        let chosenColor = "blue";
        const colors = [
          "slate",
          "blue",
          "teal",
          "green",
          "amber",
          "orange",
          "rose",
          "violet",
        ];
        
        let loading = true;
        let saving = false;
        const db = window.lpAuth;
        const savedLocal = (() => {
          try {
            return (
              JSON.parse(localStorage.getItem("lp-globe-v1") || "{}")
                ?.pipeline || {}
            );
          } catch (e) {
            return {};
          }
        })();
        function setStatus(msg, error = false) {
          $("auth").classList.toggle("error", error);
          $("auth").innerHTML = "<small>" + esc(msg) + "</small>";
        }
        function authUI() {
          $("auth").innerHTML = "";
        }
        async function loadPipeline() {
          loading = true;
          render();
          let data;
          try {
            const rows = await Promise.all([
              db.list(),
              db.tags(),
              db.cardTags(),
            ]);
            data = rows[0];
            state.tags = rows[1];
            state.cardTags = rows[2];
          } catch (error) {
            loading = false;
            setStatus("Could not load pipeline", true);
            notice(error.message);
            return;
          }
          loading = false;
          state.pipeline = Object.fromEntries(
            data.map((row) => [row.firm_id, row.stage]),
          );
          state.details = Object.fromEntries(
            data.map((row) => [
              row.firm_id,
              {
                owner: row.owner || "",
                tier: row.tier || "",
                connection: row.connection || "",
                notes: row.notes || "",
              },
            ]),
          );
          renderFilter();
          if (
            Object.keys(savedLocal).length &&
            !localStorage.getItem("lp-globe-pipeline-migrated")
          ) {
            let n = 0;
            for (const [id, stage] of Object.entries(savedLocal)) {
              if (state.pipeline[id] || !firms[+id] || !stages.includes(stage))
                continue;
              try {
                await db.put(id, stage);
              } catch (e) {
                notice("Some local cards could not sync");
                break;
              }
              state.pipeline[id] = stage;
              n++;
            }
            localStorage.setItem("lp-globe-pipeline-migrated", "1");
            if (n) notice(n + " local cards synced");
            render();
          }
        }
        function save(id, stage) {
          if (loading || saving) {
            notice("Wait for the pipeline to finish loading");
            return false;
          }
          const old = state.pipeline[id];
          if (stage === null) delete state.pipeline[id];
          else state.pipeline[id] = stage;
          saving = true;
          render();
          (async () => {
            try {
              if (stage === null) await db.del(id);
              else await db.put(id, stage);
              if (stage === null)
                state.cardTags = state.cardTags.filter(
                  (x) => x.firm_id !== +id,
                );
              saving = false;
              render();
              notice(stage === null ? "Removed" : "Saved to pipeline");
            } catch (error) {
              saving = false;
              if (old === undefined) delete state.pipeline[id];
              else state.pipeline[id] = old;
              await loadPipeline();
              notice("Not saved: " + error.message);
            }
          })();
          return true;
        }
        (async () => {
          try {
            authUI();
            await loadPipeline();
          } catch (e) {
            loading = false;
            setStatus("Could not connect. Reload the page.", true);
            notice(e.message);
          }
        })();
        function notice(s) {
          $("feedback").textContent = s;
          $("feedback").classList.add("show");
          clearTimeout(notice.t);
          notice.t = setTimeout(
            () => $("feedback").classList.remove("show"),
            2300,
          );
        }
        function records() {
          return Object.entries(state.pipeline).filter(
            ([id, stage]) =>
              Number.isInteger(+id) && firms[+id] && stages.includes(stage),
          );
        }
        function chips(id) {
          return state.cardTags
            .filter((x) => x.firm_id === +id)
            .map((x) => state.tags.find((t) => t.id === x.tag_id))
            .filter((t) => t && !["S", "A", "B", "C", "D", "F"].includes(t.name))
            .map(
              (t) =>
                '<span class="tag-chip ' +
                t.color +
                '">' +
                esc(t.name) +
                "</span>",
            )
            .join("");
        }
        function render() {
          const q = $("board-search").value.trim().toLowerCase();
          const filter = $("tag-filter").value;
          const all = records();
          $("add").disabled = loading || saving;
          $("board-search").disabled = loading;
          $("manage-tags").disabled = loading || saving;
          $("total").textContent =
            all.length + " LP" + (all.length === 1 ? "" : "s");
          $("board").innerHTML = stages
            .map((stage) => {
              const cards = all.filter(
                ([id, s]) =>
                  s === stage &&
                  (!filter ||
                    state.cardTags.some(
                      (x) => x.firm_id === +id && String(x.tag_id) === filter,
                    )) &&
                  (!q ||
                    [
                      firms[+id].name,
                      firms[+id].type,
                      firms[+id].location,
                      ...(firms[+id].contacts || []).map((c) => c.name),
                      ...state.cardTags
                        .filter((x) => x.firm_id === +id)
                        .map(
                          (x) =>
                            state.tags.find((t) => t.id === x.tag_id)?.name,
                        ),
                    ].some((x) =>
                      String(x || "")
                        .toLowerCase()
                        .includes(q),
                    )),
              );
              return (
                '<section class="stack" data-stage="' +
                stage +
                '"><div class="stack-head"><h3><button type="button" data-add-stage="' +
                stage +
                '" aria-label="Add LP to ' + stage + '">' + stage + '</button></h3><span>' +
                cards.length +
                '</span></div><div class="stack-body">' +
                (cards.length
                  ? cards
                      .map(([id]) => {
                        const f = firms[+id];
                        return (
                          '<article class="card" draggable="true" data-id="' +
                          id +
                          '" tabindex="0" aria-label="' +
                          esc(f.name) +
                          '; open details with Enter, drag to move or use arrow keys"><div class="card-top"><button class="card-name" type="button" data-open-detail="' +
                          id +
                          '">' +
                          esc(f.name) +
                          '</button><button class="grip" type="button" aria-label="Drag ' +
                          esc(f.name) +
                          '">⋮⋮</button></div>' +
                          ((state.details[id]?.tier || state.details[id]?.owner)
                            ? '<div class="card-rank">' + (state.details[id]?.tier ? '<span class="tier-pill" data-tier="' + esc(state.details[id].tier) + '" aria-label="' + esc(state.details[id].tier) + ' tier">' + esc(state.details[id].tier) + '</span>' : '') + (state.details[id]?.owner ? '<span class="card-owner" aria-label="Owner: ' + esc(state.details[id].owner) + '">' + esc(state.details[id].owner) + '</span>' : '') + '</div>' : '') +
                          (chips(id)
                            ? '<div class="tags">' + chips(id) + "</div>"
                            : "") +
                          '</article>'
                        );
                      })
                      .join("")
                  : '<div class="empty">' +
                    (loading
                      ? "Loading…"
                      : q || filter
                        ? "No matches"
                        : "Drop LPs here") +
                    "</div>") +
                "</div></section>"
              );
            })
            .join("");
        }
        function renderFilter() {
          const old = $("tag-filter").value;
          $("tag-filter").innerHTML =
            '<option value="">All tags</option>' +
            state.tags
              .map(
                (t) =>
                  '<option value="' + t.id + '">' + esc(t.name) + "</option>",
              )
              .join("");
          $("tag-filter").value = state.tags.some((t) => String(t.id) === old)
            ? old
            : "";
          render();
        }
        function palette() {
          $("tag-palette").innerHTML = colors
            .map(
              (c) =>
                '<button type="button" class="' +
                c +
                (c === chosenColor ? " active" : "") +
                '" data-color="' +
                c +
                '" aria-label="' +
                c +
                ' color" aria-pressed="' +
                (c === chosenColor) +
                '"></button>',
            )
            .join("");
        }
        function openTags(id = null) {
          if (loading || saving) return;
          activeFirm = id === null ? null : +id;
          editTagId = null;
          chosenColor = "blue";
          $("tag-name").value = "";
          $("tag-submit").textContent = "Create tag";
          $("tag-title").textContent =
            id === null ? "Manage tags" : "Tags · " + firms[+id].name;
          palette();
          renderTagList();
          $("tag-modal").classList.add("show");
        }
        function closeTags() {
          $("tag-modal").classList.remove("show");
          activeFirm = null;
          editTagId = null;
        }
        function renderTagList() {
          const selected = new Set(
            state.cardTags
              .filter((x) => x.firm_id === activeFirm)
              .map((x) => x.tag_id),
          );
          $("tag-list").innerHTML = state.tags.length
            ? state.tags
                .map(
                  (t) =>
                    '<div class="tag-row">' +
                    (activeFirm === null
                      ? ""
                      : '<button type="button" data-toggle="' +
                        t.id +
                        '" aria-label="' +
                        (selected.has(t.id) ? "Remove" : "Add") +
                        " " +
                        esc(t.name) +
                        '" aria-pressed="' +
                        selected.has(t.id) +
                        '">' +
                        (selected.has(t.id) ? "✓" : "+") +
                        "</button>") +
                    '<span class="tag-chip ' +
                    t.color +
                    '">' +
                    esc(t.name) +
                    '</span><button type="button" data-edit="' +
                    t.id +
                    '" aria-label="Edit ' +
                    esc(t.name) +
                    '">Edit</button><button type="button" data-delete="' +
                    t.id +
                    '" aria-label="Delete ' +
                    esc(t.name) +
                    '">×</button></div>',
                )
                .join("")
            : '<div class="empty">Create a tag below</div>';
        }
        $("manage-tags").onclick = () => openTags();
        $("tag-filter").onchange = render;
        $("board").addEventListener("click", (e) => {
          const b = e.target.closest("[data-edit-card]");
          if (b) { openCard(+b.dataset.editCard, false); return; }
          const card = e.target.closest(".card");
          if (card && !e.target.closest(".grip")) openDetail(+card.dataset.id);
        });
        $("tag-close").onclick = closeTags;
        $("tag-modal").addEventListener("pointerdown", (e) => {
          if (e.target === $("tag-modal")) closeTags();
        });
        $("tag-palette").onclick = (e) => {
          const b = e.target.closest("[data-color]");
          if (b) {
            chosenColor = b.dataset.color;
            palette();
          }
        };
        $("tag-form").onsubmit = async (e) => {
          e.preventDefault();
          if (saving) return;
          const name = $("tag-name").value.trim();
          if (!name || name.length > 32 || !colors.includes(chosenColor))
            return;
          if (
            state.tags.some(
              (t) =>
                t.name.toLowerCase() === name.toLowerCase() &&
                t.id !== editTagId,
            )
          ) {
            notice("Tag name already exists");
            return;
          }
          saving = true;
          try {
            if (editTagId) await db.updateTag(editTagId, name, chosenColor);
            else await db.createTag(name, chosenColor);
            state.tags = await db.tags();
            editTagId = null;
            $("tag-name").value = "";
            $("tag-submit").textContent = "Create tag";
            renderTagList();
            renderFilter();
            notice("Tag saved");
          } catch (error) {
            notice("Not saved: " + error.message);
          } finally {
            saving = false;
            render();
          }
        };
        $("tag-list").onclick = async (e) => {
          const b = e.target.closest("[data-toggle],[data-edit],[data-delete]");
          if (!b || saving) return;
          const id = +(b.dataset.toggle || b.dataset.edit || b.dataset.delete);
          const t = state.tags.find((x) => x.id === id);
          if (!t) return;
          if (b.dataset.edit) {
            editTagId = id;
            $("tag-name").value = t.name;
            chosenColor = t.color;
            palette();
            $("tag-submit").textContent = "Save tag";
            $("tag-name").focus();
            return;
          }
          if (
            b.dataset.delete &&
            !confirm('Delete tag "' + t.name + '" from every card?')
          )
            return;
          saving = true;
          try {
            if (b.dataset.delete) {
              await db.deleteTag(id);
              state.tags = state.tags.filter((x) => x.id !== id);
              state.cardTags = state.cardTags.filter((x) => x.tag_id !== id);
              if (editTagId === id) {
                editTagId = null;
                $("tag-name").value = "";
                $("tag-submit").textContent = "Create tag";
              }
            } else {
              const existing = state.cardTags.some(
                (x) => x.firm_id === activeFirm && x.tag_id === id,
              );
              await db.setCardTag(activeFirm, id, !existing);
              if (existing)
                state.cardTags = state.cardTags.filter(
                  (x) => !(x.firm_id === activeFirm && x.tag_id === id),
                );
              else state.cardTags.push({ firm_id: activeFirm, tag_id: id });
            }
            renderTagList();
            renderFilter();
            notice(b.dataset.delete ? "Tag deleted" : "Card tags saved");
          } catch (error) {
            notice("Not saved: " + error.message);
          } finally {
            saving = false;
            render();
          }
        };
        function picker() {
          const q = $("pick-search").value.trim().toLowerCase();
          const matches = firms
            .map((f, id) => ({ f, id }))
            .filter(
              ({ f, id }) =>
                !state.pipeline[id] &&
                (!q ||
                  [
                    f.name,
                    f.type,
                    f.location,
                    ...(f.contacts || []).map((c) => c.name),
                  ].some((x) =>
                    String(x || "")
                      .toLowerCase()
                      .includes(q),
                  )),
            )
            .sort((a, b) => a.f.name.localeCompare(b.f.name, undefined, { sensitivity: "base", numeric: true }));
          $("pick-list-title").textContent = (q ? "Matching LPs" : "All LPs") + " · " + matches.length;
          $("pick-list").innerHTML = matches.length
            ? matches
                .map(
                  ({ f, id }) =>
                    '<button class="pick-row" type="button" data-add="' +
                    id +
                    '"><span><strong>' +
                    esc(f.name) +
                    "</strong><small>" +
                    esc([f.type, f.location].filter(Boolean).join(" · ")) +
                    "</small></span><b>+</b></button>",
                )
                .join("")
            : '<div class="empty">No LPs match</div>';
        }
        function open(stage = selectedStage) {
          if (loading || saving) return;
          selectedStage = stages.includes(stage) ? stage : stages[0];
          $("pick-stage").value = selectedStage;
          $("picker").classList.add("show");
          $("pick-search").value = "";
          picker();
          $("pick-list").querySelector(".pick-row")?.focus();
        }
        function close() {
          $("picker").classList.remove("show");
          $("add").focus();
        }
        function profileLink(url, label) {
          if (!/^https:\/\//i.test(url || "")) return "";
          return '<a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + label + '</a>';
        }
        async function loadProfiles() {
          if (profiles) return profiles;
          const response = await fetch('index.html');
          if (!response.ok) throw new Error('Could not load Globe profiles');
          const source = await response.text();
          const line = source.split('\n').find(x => x.startsWith('firms=[{"name":'));
          if (!line || !line.endsWith('];')) throw new Error('Globe profiles unavailable');
          const data = JSON.parse(line.slice(6, -1));
          if (data.length !== firms.length || data.some((f, i) => f.name !== firms[i].name))
            throw new Error('Globe profiles do not match pipeline firms');
          profiles = data;
          return data;
        }
        async function openDetail(id) {
          if (loading || saving || !state.pipeline[id] || !firms[id]) return;
          detailFirm = +id;
          detailReturn = document.activeElement;
          const f = firms[id], d = state.details[id] || {};
          $("detail-title").textContent = f.name;
          $("detail-content").textContent = "Loading firm profile…";
          $("detail-modal").classList.add("show");
          $("detail-close").focus();
          let p = {};
          try { p = (await loadProfiles())[id]; }
          catch (error) { notice(error.message); }
          if (detailFirm !== +id) return;
          const tagChips = chips(id);
          $("detail-title").textContent = f.name;
          const row = (label, value) => '<div class="detail-field"><dt>' + label + '</dt><dd>' + esc(value || "—") + '</dd></div>';
          const people = (p.contacts || f.contacts || []).map(c => {
            const links = [
              c.orgEmail && '<a href="mailto:' + encodeURIComponent(c.orgEmail) + '">Org email' + (c.unverified ? ' (unverified)' : '') + '</a>',
              c.personalEmail && '<a href="mailto:' + encodeURIComponent(c.personalEmail) + '">Personal email</a>',
              profileLink(c.linkedin, 'LinkedIn ↗')
            ].filter(Boolean).join('');
            return '<div class="detail-person"><strong>' + esc(c.name) + '</strong>' +
              (c.role ? '<div class="role">' + esc(c.role) + '</div>' : '') +
              (links ? '<div class="person-links">' + links + '</div>' : '') +
              (c.bio ? '<p class="bio">' + esc(c.bio) + '</p>' : '') + '</div>';
          }).join('');
          $("detail-content").innerHTML =
            '<div class="detail-meta"><span>' + esc(category(f)) + '</span><span>' + esc(f.location || 'Location unknown') + '</span><span>' + esc(f.aum || 'AUM unknown') + '</span>' + (tagChips ? '<div class="tags">' + tagChips + '</div>' : '') + '</div>' +
            row('Stack', state.pipeline[id]) + row('Tier', d.tier ? d.tier + ' tier' : 'Unranked') + row('Owner', d.owner || 'Unknown owner') +
            row('Connection', d.connection) + row('Notes', d.notes) +
            '<h3 class="detail-section">Firm profile</h3>' +
            '<p class="detail-description">' + esc(p.description || 'No firm description yet.') + '</p>' +
            '<h3 class="detail-section">People (' + (p.contacts || f.contacts || []).length + ')</h3>' +
            (people || '<p>No people listed.</p>');
          $("detail-content").scrollTop = 0;
          $("detail-modal").classList.add("show");
          $("detail-close").focus();
        }
        function closeDetail(restoreFocus = true) {
          $("detail-modal").classList.remove("show");
          detailFirm = null;
          if (restoreFocus && detailReturn?.isConnected) detailReturn.focus();
        }
        $("detail-close").onclick = () => closeDetail();
        $("detail-modal").addEventListener("pointerdown", e => {
          if (e.target === $("detail-modal")) closeDetail();
        });
        $("detail-edit").onclick = () => {
          const id = detailFirm;
          if (id === null) return;
          closeDetail(false);
          openCard(id, false);
        };
        $("detail-tags").onclick = () => {
          const id = detailFirm;
          if (id === null) return;
          closeDetail(false);
          openTags(id);
        };
        function openCard(id, isNew) {
          cardFirm = id;
          cardIsNew = isNew;
          const d = state.details[id] || {};
          $("card-title").textContent = firms[id].name;
          $("card-stage").value = isNew ? selectedStage : (state.pipeline[id] || stages[0]);
          $("card-owner").value = d.owner || "";
          $("card-tier").value = d.tier || "";
          $("card-connection").value = d.connection || "";
          $("card-notes").value = d.notes || "";
          $("card-tag-name").value = "";
          $("card-tag-color").value = "blue";
          $("card-tag-options").innerHTML = "";
          renderCardTags();
          $("card-modal").classList.add("show");
          $("card-owner").focus();
        }
        function renderCardTags(extraSelected = null) {
          const previous = $("card-tag-options").querySelectorAll("input[type=checkbox]");
          const chosen = previous.length
            ? new Set([...previous].filter((input) => input.checked).map((input) => +input.value))
            : new Set(state.cardTags
                .filter((x) => x.firm_id === cardFirm)
                .map((x) => x.tag_id));
          if (extraSelected !== null) chosen.add(extraSelected);
          const ordinaryTags = state.tags.filter((t) => !["S", "A", "B", "C", "D", "F"].includes(t.name));
          $("card-tag-options").innerHTML = ordinaryTags.length
            ? ordinaryTags
                .map(
                  (t) =>
                    '<label><input type="checkbox" value="' +
                    t.id +
                    '" ' +
                    (chosen.has(t.id) ? "checked" : "") +
                    '><span class="tag-chip ' +
                    t.color +
                    '">' +
                    esc(t.name) +
                    "</span></label>",
                )
                .join("")
            : "<small>No tags yet. Create one below.</small>";
        }
        $("card-tag-create").onclick = async () => {
          if (saving || cardFirm === null) return;
          const name = $("card-tag-name").value.trim();
          const color = $("card-tag-color").value;
          if (!name) {
            $("card-tag-name").focus();
            return;
          }
          if (name.length > 32 || !colors.includes(color)) return;
          if (state.tags.some((t) => t.name.toLowerCase() === name.toLowerCase())) {
            notice("Tag name already exists");
            return;
          }
          saving = true;
          $("card-tag-create").disabled = true;
          try {
            const created = await db.createTag(name, color);
            state.tags = await db.tags();
            const tag = state.tags.find((t) => t.id === created?.[0]?.id) ||
              state.tags.find((t) => t.name.toLowerCase() === name.toLowerCase());
            renderCardTags(tag?.id ?? null);
            renderFilter();
            $("card-tag-name").value = "";
            notice("Tag created. Save card to apply it.");
          } catch (error) {
            notice("Tag not saved: " + error.message);
          } finally {
            saving = false;
            $("card-tag-create").disabled = false;
            render();
          }
        };
        $("card-tag-name").addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            $("card-tag-create").click();
          }
        });
        function closeCard() {
          $("card-modal").classList.remove("show");
          cardFirm = null;
          cardIsNew = false;
        }
        for (const select of [$("pick-stage"), $("card-stage")]) {
          select.innerHTML = stages.map(stage => '<option value="' + stage + '">' + stage + '</option>').join('');
        }
        $("pick-stage").onchange = () => { selectedStage = $("pick-stage").value; };
        $("board").addEventListener("click", (event) => {
          const trigger = event.target.closest("[data-add-stage]");
          if (trigger) { open(trigger.dataset.addStage); return; }
          const body = event.target.closest(".stack-body");
          if (body && !event.target.closest(".card, button, a")) open(body.closest(".stack").dataset.stage);
        });
        $("add").onclick = () => open(stages[0]);
        $("close").onclick = close;
        $("card-close").onclick = closeCard;
        $("card-cancel").onclick = closeCard;
        $("card-modal").addEventListener("pointerdown", (e) => {
          if (e.target === $("card-modal")) closeCard();
        });
        $("picker").addEventListener("pointerdown", (e) => {
          if (e.target === $("picker")) close();
        });
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && $("detail-modal").classList.contains("show"))
            closeDetail();
          else if (e.key === "Escape" && $("card-modal").classList.contains("show"))
            closeCard();
          else if (e.key === "Escape" && $("picker").classList.contains("show"))
            close();
          else if (
            e.key === "Escape" &&
            $("tag-modal").classList.contains("show")
          )
            closeTags();
        });
        $("pick-search").oninput = picker;
        $("board-search").oninput = render;
        $("pick-list").onclick = (e) => {
          const b = e.target.closest("[data-add]");
          if (!b) return;
          close();
          openCard(+b.dataset.add, true);
        };
        $("card-form").onsubmit = async (e) => {
          e.preventDefault();
          if (saving || cardFirm === null) return;
          const id = cardFirm,
            detail = {
              owner: $("card-owner").value,
              tier: $("card-tier").value,
              connection: $("card-connection").value.trim(),
              notes: $("card-notes").value.trim(),
            },
            chosen = new Set(
              [...$("card-tag-options").querySelectorAll("input:checked")].map(
                (x) => +x.value,
              ),
            ),
            old = new Set(
              state.cardTags
                .filter((x) => x.firm_id === id)
                .map((x) => x.tag_id),
            );
          saving = true;
          $("card-submit").disabled = true;
          try {
            const stage = $("card-stage").value;
            if (!stages.includes(stage)) throw new Error("Choose a stack");
            await db.put(id, stage, detail);
            for (const tag of state.tags) {
              if (chosen.has(tag.id) !== old.has(tag.id))
                await db.setCardTag(id, tag.id, chosen.has(tag.id));
            }
            closeCard();
            await loadPipeline();
            notice("Card saved");
          } catch (error) {
            await loadPipeline();
            notice("Not saved: " + error.message);
          } finally {
            saving = false;
            $("card-submit").disabled = false;
            render();
          }
        };
        $("board").addEventListener("keydown", (e) => {
          const c = e.target.closest(".card");
          if (!c || e.target !== c) return;
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            openDetail(+c.dataset.id);
            return;
          }
          if (!["ArrowRight", "ArrowLeft"].includes(e.key)) return;
          e.preventDefault();
          const id = c.dataset.id;
          const n =
            stages.indexOf(state.pipeline[id]) +
            (e.key === "ArrowRight" ? 1 : -1);
          if (n < 0 || n >= stages.length) return;
          if (!save(id, stages[n])) return;
          document.querySelector('.card[data-id="' + id + '"]')?.focus();
          notice("Moved to " + stages[n]);
        });
        let dragId = null;
        $("board").addEventListener("dragstart", (e) => {
          const c = e.target.closest(".card");
          if (!c) return;
          dragId = c.dataset.id;
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("text/plain", dragId);
          setTimeout(() => c.classList.add("dragging"), 0);
        });
        $("board").addEventListener("dragover", (e) => {
          const s = e.target.closest(".stack");
          if (s) {
            e.preventDefault();
            e.dataTransfer.dropEffect = "move";
            document
              .querySelectorAll(".stack.over")
              .forEach((x) => x.classList.remove("over"));
            s.classList.add("over");
          }
        });
        $("board").addEventListener("drop", (e) => {
          const s = e.target.closest(".stack");
          if (!s) return;
          e.preventDefault();
          const id = dragId || e.dataTransfer.getData("text/plain");
          if (
            !saving &&
            state.pipeline[id] &&
            s.dataset.stage !== state.pipeline[id]
          ) {
            save(id, s.dataset.stage);
          } else
            document
              .querySelectorAll(".stack.over")
              .forEach((x) => x.classList.remove("over"));
          dragId = null;
        });
        $("board").addEventListener("dragend", () => {
          dragId = null;
          document
            .querySelectorAll(".stack.over,.card.dragging")
            .forEach((x) => x.classList.remove("over", "dragging"));
        });
        let touch = null;
        $("board").addEventListener("pointerdown", (e) => {
          const grip = e.target.closest(".grip");
          if (!grip || e.pointerType === "mouse") return;
          e.preventDefault();
          const card = grip.closest(".card");
          touch = {
            id: card.dataset.id,
            x: e.clientX,
            y: e.clientY,
            ghost: null,
          };
          card.classList.add("touch-drag");
          grip.setPointerCapture(e.pointerId);
        });
        $("board").addEventListener("pointermove", (e) => {
          if (!touch) return;
          e.preventDefault();
          if (
            !touch.ghost &&
            Math.hypot(e.clientX - touch.x, e.clientY - touch.y) > 5
          ) {
            touch.ghost = document
              .querySelector('.card[data-id="' + touch.id + '"]')
              .cloneNode(true);
            touch.ghost.classList.add("drag-ghost");
            document.body.append(touch.ghost);
          }
          if (touch.ghost) {
            const viewport = $("board").getBoundingClientRect();
            if (e.clientX > viewport.right - 35) $("board").scrollLeft += 25;
            else if (e.clientX < viewport.left + 35)
              $("board").scrollLeft -= 25;
            touch.ghost.style.left = e.clientX - 100 + "px";
            touch.ghost.style.top = e.clientY - 35 + "px";
            document
              .querySelectorAll(".stack.over")
              .forEach((x) => x.classList.remove("over"));
            const hitX = Math.max(
              viewport.left + 1,
              Math.min(viewport.right - 1, e.clientX),
            );
            const under = document
              .elementFromPoint(hitX, e.clientY)
              ?.closest(".stack");
            if (under) under.classList.add("over");
          }
        });
        function finish(e) {
          if (!touch) return;
          const viewport = $("board").getBoundingClientRect();
          const hitX = Math.max(
            viewport.left + 1,
            Math.min(viewport.right - 1, e.clientX),
          );
          const s = document
            .elementFromPoint(hitX, e.clientY)
            ?.closest(".stack");
          touch.ghost?.remove();
          document
            .querySelector(".card.touch-drag")
            ?.classList.remove("touch-drag");
          if (!saving && s && s.dataset.stage !== state.pipeline[touch.id]) {
            save(touch.id, s.dataset.stage);
          } else
            document
              .querySelectorAll(".stack.over")
              .forEach((x) => x.classList.remove("over"));
          touch = null;
        }
        $("board").addEventListener("pointerup", finish);
        $("board").addEventListener("pointercancel", finish);
        render();
      })();
    </script>
  </body>
</html>
