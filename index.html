<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>CapitalTrack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #141414;
        --sub: #666;
        --rule: #dedede;
        --soft: #f6f6f5;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #fff;
        color: var(--ink);
      }
      body {
        font-family: Arial, Helvetica, sans-serif;
        -webkit-font-smoothing: antialiased;
        font-size: 14px;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
        border-radius: 0;
      }
      a {
        color: inherit;
      }
      .shell {
        max-width: 1680px;
        margin: auto;
        padding: 0 28px;
      }
      .top {
        border-bottom: 1px solid var(--ink);
      }
      .top-inner {
        min-height: 76px;
        display: flex;
        align-items: center;
        gap: 23px;
      }
      .brand {
        font-family: Georgia, serif;
        letter-spacing: -0.055em;
        font-size: 24px;
        font-weight: 600;
        text-decoration: none;
        white-space: nowrap;
      }
      .divider {
        height: 23px;
        width: 1px;
        background: var(--rule);
      }
      h1 {
        font-size: 15px;
        letter-spacing: -0.025em;
        margin: 0;
        font-weight: 600;
      }
      .actions {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .search {
        border: 1px solid var(--rule);
        width: 230px;
        height: 38px;
        padding: 0 12px;
        outline: 0;
        border-radius: 0;
        min-width: 0;
      }
      .search:focus,
      .pick-search:focus {
        border-color: var(--ink);
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 10px 18px;
        flex-wrap: wrap;
        padding: 16px 0 14px;
        border-bottom: 1px solid var(--rule);
        margin-bottom: 14px;
      }
      .count {
        font-size: 12px;
        color: var(--sub);
        white-space: nowrap;
      }
      .board {
        display: grid;
        grid-template-columns: repeat(7, minmax(190px, 1fr));
        gap: 14px;
        align-items: start;
        padding-bottom: 50px;
      }
      .stack {
        border-top: 2px solid var(--ink);
        min-height: 330px;
        background: #fafafa;
      }
      .stack-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 5px;
        padding: 16px 14px 17px;
      }
      .stack-head h3 {
        margin: 0;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .stack-head span {
        font-size: 12px;
        color: var(--sub);
      }
      .stack-body {
        padding: 0 9px 12px;
        min-height: 250px;
      }
      .stack-head button { border: 0; background: transparent; font-weight: 600; font-size: 12px; padding: 5px 3px; margin: -5px 0; text-align: left; }
      .stack-head button:hover { text-decoration: underline; text-underline-offset: 3px; }
      .stack-head button:focus-visible, .stack-body:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
      .stack-body { cursor: pointer; }
      .stack-body .card { cursor: grab; }
      .stack.over {
        background: #f0f0ed;
      }
      .card {
        background: #fff;
        border: 1px solid var(--rule);
        padding: 13px 13px 12px;
        margin-bottom: 8px;
        touch-action: auto;
        cursor: grab;
      }
      .card:hover {
        border-color: var(--ink);
      }
      .card.dragging {
        opacity: 0.3;
      }
      .card-top {
        display: flex;
        align-items: flex-start;
        gap: 5px;
        justify-content: space-between;
      }
      .card-name {
        font-weight: 600;
        line-height: 1.35;
        overflow-wrap: anywhere;
        text-decoration: none;
      }
      .card-name:hover {
        text-decoration: underline;
      }
      .grip {
        flex: none;
        color: #999;
        border: 0;
        background: none;
        padding: 0 0 5px 8px;
        font-size: 20px;
        line-height: 16px;
        touch-action: none;
        cursor: grab;
        user-select: none;
      }
      .grip:active {
        cursor: grabbing;
      }
      .card.touch-drag {
        touch-action: none;
      }
      .meta {
        color: var(--sub);
        font-size: 11px;
        line-height: 1.45;
        margin-top: 9px;
        overflow-wrap: anywhere;
      }
      .aum {
        margin-top: 13px;
        font-size: 15px;
        font-family: Georgia, serif;
      }
      .tier-pill { display: inline-flex; align-items: center; justify-content: center; min-width: 27px; padding: 4px 6px; border: 1px solid #242424; font: 700 11px/1 Arial, sans-serif; color: #242424; background: #f8f6ef; flex: none; }
      .card-rank { display: flex; align-items: center; gap: 8px; margin-top: 9px; font: 11px/1.3 Arial, sans-serif; color: var(--sub); }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 12px;
      }
      .tag-chip {
        display: inline-flex;
        align-items: center;
        max-width: 100%;
        padding: 3px 7px;
        font:
          600 10px/1.4 Arial,
          sans-serif;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        border: 1px solid currentColor;
      }
      .tag-chip.slate {
        color: #4b5563;
        background: #f3f4f6;
      }
      .tag-chip.blue {
        color: #1d4e8f;
        background: #eaf2fc;
      }
      .tag-chip.teal {
        color: #116b70;
        background: #e4f4f3;
      }
      .tag-chip.green {
        color: #2d6738;
        background: #e8f5e9;
      }
      .tag-chip.amber {
        color: #805300;
        background: #fff2d2;
      }
      .tag-chip.orange {
        color: #9b4300;
        background: #fff0e3;
      }
      .tag-chip.rose {
        color: #963b55;
        background: #fbeaf0;
      }
      .tag-chip.violet {
        color: #69468b;
        background: #f1ebf8;
      }
      .tag-open {
        border: 0;
        background: transparent;
        color: #666;
        font-size: 11px;
        text-decoration: underline;
        text-underline-offset: 3px;
        padding: 7px 0 0;
      }
      .tag-open:hover {
        color: #141414;
      }
      .tools {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin-left: auto;
      }
      .tools select,
      .tools button {
        border: 1px solid var(--rule);
        background: #fff;
        height: 34px;
        padding: 0 10px;
        font-size: 12px;
      }
      .tools button:hover {
        border-color: var(--ink);
      }
      .tag-list {
        overflow-y: auto;
        padding: 7px 19px;
        min-height: 90px;
      }
      .tag-row {
        display: flex;
        gap: 9px;
        align-items: center;
        border-bottom: 1px solid var(--rule);
        padding: 9px 0;
      }
      .tag-row .tag-chip {
        margin-right: auto;
      }
      .tag-row button {
        border: 1px solid var(--rule);
        background: white;
        min-width: 34px;
        min-height: 34px;
        padding: 0 9px;
      }
      .tag-row button:hover {
        border-color: var(--ink);
      }
      .tag-create {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        padding: 15px 19px;
        border-top: 1px solid var(--rule);
      }
      .tag-create input {
        min-width: 120px;
        flex: 1;
        border: 1px solid var(--rule);
        height: 40px;
        padding: 0 10px;
        font-size: 16px;
      }
      .tag-create select {
        border: 1px solid var(--rule);
        height: 40px;
        padding: 0 6px;
        background: #fff;
      }
      .tag-create button {
        height: 40px;
        border: 1px solid var(--ink);
        background: #141414;
        color: white;
        padding: 0 15px;
      }
      .palette {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .palette button {
        width: 24px;
        height: 24px;
        padding: 0;
        border: 1px solid #999;
        outline-offset: 2px;
      }
      .palette button.active {
        outline: 2px solid #141414;
      }
      .palette button.slate {
        background: #f3f4f6;
      }
      .palette button.blue {
        background: #8ebbe9;
      }
      .palette button.teal {
        background: #73c8bc;
      }
      .palette button.green {
        background: #9bd6a1;
      }
      .palette button.amber {
        background: #f5d37e;
      }
      .palette button.orange {
        background: #f2ae79;
      }
      .palette button.rose {
        background: #eba1b5;
      }
      .palette button.violet {
        background: #c4a8e3;
      }
      .card-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        margin-top: 14px;
      }
      .stage-select {
        font-size: 11px;
        border: 1px solid var(--rule);
        background: #fff;
        color: var(--ink);
        padding: 6px;
        max-width: 100%;
        border-radius: 0;
      }
      .remove {
        border: 0;
        background: none;
        color: var(--sub);
        font-size: 18px;
        padding: 2px 6px;
      }
      .remove:hover {
        color: var(--ink);
      }
      .empty {
        color: #999;
        font-size: 12px;
        padding: 20px 5px;
        text-align: center;
      }
      .drag-ghost {
        position: fixed;
        pointer-events: none;
        z-index: 100;
        box-shadow: 0 14px 30px #0002;
        opacity: 0.96;
        width: 240px;
        transform: rotate(1deg);
      }
      .kpis { display: flex; gap: 1px; background: var(--rule); border: 1px solid var(--rule); margin: 0 0 14px; overflow-x: auto; }
      .kpi { background: #fff; padding: 10px 14px 9px; min-width: 92px; flex: 1 0 auto; }
      .kpi b { display: block; font: 600 20px/1.1 Arial, Helvetica, sans-serif; }
      .kpi span { display: block; font: 600 9px/1 Arial, Helvetica, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--sub); margin-top: 4px; }
      .kpi small { display: block; font: 10px/1 Arial, Helvetica, sans-serif; color: var(--sub); margin-top: 3px; }
      .card-touch { margin-top: 8px; font: 10px/1.3 Arial, Helvetica, sans-serif; letter-spacing: .04em; text-transform: uppercase; color: var(--sub); }
      .touch-row { display: flex; gap: 6px; flex-wrap: wrap; }
      .touch-btn { border: 1px solid var(--ink); background: #fff; padding: 8px 12px; font: 600 11px/1 Arial, Helvetica, sans-serif; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
      .touch-btn:hover { background: var(--ink); color: #fff; }
      .touch-note { display: flex; gap: 6px; margin-top: 8px; }
      .touch-note[hidden] { display: none; }
      .touch-note input { flex: 1; border: 1px solid var(--ink); padding: 8px 10px; font: 13px Arial, Helvetica, sans-serif; }
      .touch-note button { border: 1px solid var(--ink); background: var(--ink); color: #fff; padding: 8px 12px; font: 600 11px/1 Arial, Helvetica, sans-serif; text-transform: uppercase; letter-spacing: .06em; cursor: pointer; }
      .touch-list { list-style: none; margin: 10px 0 0; padding: 0; }
      .touch-list li { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 6px 0; border-top: 1px solid var(--rule); font: 12px/1.4 Arial, Helvetica, sans-serif; }
      .touch-del { border: 0; background: none; color: var(--sub); cursor: pointer; font-size: 14px; padding: 0 2px; }
      .touch-del:hover { color: var(--ink); }
      .touch-empty { font: 12px Arial, Helvetica, sans-serif; color: var(--sub); margin: 8px 0 0; }
      .minmax { display: flex; gap: 6px; }
      .minmax input { width: 50%; }
      .fab-wrap { position: fixed; right: calc(18px + env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 40; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
      .fab { width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--ink); background: var(--ink); color: #fff; font-size: 26px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; padding-bottom: 3px; }
      .fab-menu { display: flex; flex-direction: column; gap: 6px; }
      .fab-menu[hidden] { display: none; }
      .fab-menu button { border: 1px solid var(--ink); background: #fff; padding: 10px 14px; font: 600 11px/1 Arial, Helvetica, sans-serif; letter-spacing: .07em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
      .fab-menu button:hover { background: var(--ink); color: #fff; }
      .fab:focus-visible, .fab-menu button:focus-visible, .touch-btn:focus-visible, .touch-note button:focus-visible, .touch-del:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
      .globe-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 33px;
        min-width: 33px;
        border: 1px solid transparent;
        background: #fff;
        color: var(--ink);
        cursor: pointer;
        padding: 0 8px;
      }
      .globe-btn:hover {
        border-color: var(--ink);
      }
      .pane-nav .v1 {
        letter-spacing: .03em;
      }
      .globe-modal {
        position: fixed;
        inset: 0;
        z-index: 70;
        background: #0005;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 18px;
      }
      .globe-modal.show {
        display: flex;
      }
      .globe-panel {
        position: relative;
        background: white;
        width: 100%;
        height: 100%;
        border: 1px solid var(--ink);
        display: flex;
      }
      .globe-panel iframe {
        flex: 1;
        border: 0;
        display: block;
      }
      .globe-close {
        position: absolute;
        top: 8px;
        right: 10px;
        z-index: 2;
        border: 1px solid var(--ink);
        background: #fff;
        width: 30px;
        height: 30px;
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
      }
      .picker {
        position: fixed;
        inset: 0;
        z-index: 60;
        background: #0005;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 18px;
      }
      .picker.show {
        display: flex;
      }
      .pick-panel {
        background: white;
        width: min(520px, 100%);
        max-height: min(620px, 85dvh);
        display: flex;
        flex-direction: column;
        border: 1px solid var(--ink);
      }
      .pick-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--rule);
        padding: 16px 19px;
      }
      .pick-head h2 {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
      }
      .close {
        background: white;
        border: 0;
        font-size: 24px;
        line-height: 1;
        padding: 0 2px;
      }
      .pick-search {
        width: calc(100% - 38px);
        margin: 18px 19px 11px;
        padding: 11px 12px;
        border: 1px solid var(--rule);
        outline: 0;
        font-size: 16px;
        border-radius: 0;
      }
      .pick-stage-label { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 19px 12px; font-size: 12px; font-weight: 600; }
      .pick-stage-label select { flex: 1; max-width: 230px; padding: 9px 10px; border: 1px solid var(--rule); background: #fff; border-radius: 0; font-size: 16px; }
      .pick-list-title { margin: 3px 19px 6px; font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--sub); }
      .pick-list { flex: 1; min-height: 0;
        overflow: auto;
        padding: 0 19px 18px;
        overscroll-behavior: contain;
      }
      .pick-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        width: 100%;
        background: white;
        border: 0;
        border-bottom: 1px solid var(--rule);
        text-align: left;
        padding: 12px 0;
        min-height: 54px;
      }
      .pick-row:hover,
      .pick-row:focus {
        background: var(--soft);
      }
      .pick-row strong {
        font-size: 13px;
        display: block;
        line-height: 1.3;
      }
      .pick-row small {
        font-size: 11px;
        color: var(--sub);
        display: block;
        margin-top: 3px;
      }
      .pick-row b {
        font-size: 20px;
        font-weight: 400;
      }
      .pick-row:disabled {
        color: #999;
        cursor: default;
      }
      .pick-row:disabled b {
        font-size: 11px;
      }
      .feedback {
        position: fixed;
        bottom: calc(20px + env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        background: var(--ink);
        color: #fff;
        padding: 10px 15px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.18s;
        z-index: 90;
        font-size: 12px;
      }
      .feedback.show {
        opacity: 1;
      }
      @media (min-width: 1001px) {
        .board { overflow-x: auto; grid-template-columns: repeat(7, minmax(210px, 1fr)); padding-bottom: 28px; }
      }
      @media (min-width: 601px) and (max-width: 1000px) {
        .board {
          gap: 14px;
        }
        .stack {
          flex: 0 0 min(31vw, 285px);
        }
        .toolbar {
          padding-top: 14px;
        }
      }
      @media (max-width: 1000px) {
        .board {
          display: flex;
          overflow-x: auto;
          scroll-snap-type: x proximity;
          gap: 12px;
          margin: 0 -28px;
          padding: 0 28px 40px;
          overscroll-behavior-inline: contain;
        }
        .stack {
          flex: 0 0 250px;
          scroll-snap-align: start;
          min-height: 58vh;
        }
        .board::-webkit-scrollbar {
          height: 5px;
        }
        .board::-webkit-scrollbar-thumb {
          background: #ccc;
        }
      }
      @media (max-width: 600px) {
        .shell {
          padding: 0 16px;
        }
        .top-inner {
          min-height: 68px;
          gap: 12px;
          flex-wrap: wrap;
          padding-top: 12px;
          padding-bottom: 12px;
        }
        .brand {
          font-size: 21px;
        }
        .divider {
          height: 17px;
        }
        .top h1 {
          font-size: 14px;
        }
        .actions {
          flex-basis: 100%;
          margin-left: 0;
          gap: 8px;
        }
        .search {
          flex: 1;
          width: auto;
          height: 42px;
          font-size: 16px;
        }
        .toolbar {
          padding: 12px 0;
          gap: 10px 12px;
        }
        .toolbar .auth {
          flex-basis: 100%;
        }
        .toolbar .count {
          margin-left: auto;
        }
        .pane-nav {
          margin-left: 0;
        }
        .pane-nav a {
          padding: 7px 9px;
        }
        .board {
          margin: 0 -16px;
          padding: 0 16px 32px;
        }
        .stack {
          flex-basis: min(82vw, 310px);
        }
        .picker {
          align-items: flex-end;
          padding: 0;
        }
        .pick-panel {
          width: 100%;
          max-height: 83dvh;
          min-height: 60dvh;
          border-left: 0;
          border-right: 0;
          border-bottom: 0;
          padding-bottom: env(safe-area-inset-bottom);
        }
      }
      .card-detail {
        font-size: 11px;
        line-height: 1.5;
        color: var(--sub);
        margin-top: 8px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .card-detail strong {
        color: var(--ink);
      }
      .card-edit {
        border: 1px solid var(--rule);
        background: #fff;
        padding: 6px 9px;
        font-size: 11px;
        margin-top: 12px;
      }
      .card-edit:hover {
        border-color: var(--ink);
      }
      .card-form {
        overflow: auto;
        padding: 18px 19px;
        display: grid;
        gap: 16px;
      }
      .card-form label {
        display: grid;
        gap: 7px;
        font-size: 12px;
        font-weight: 600;
      }
      .card-form input,
      .card-form textarea,
      .card-form select {
        border: 1px solid var(--rule);
        border-radius: 0;
        padding: 10px;
        font-size: 16px;
        background: #fff;
        color: var(--ink);
        width: 100%;
      }
      .card-form textarea {
        min-height: 130px;
        resize: vertical;
      }
      .card-form .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      .card-form .form-actions button {
        padding: 10px 16px;
        background: #fff;
        border: 1px solid var(--rule);
      }
      .card-form .form-actions button[type="submit"] {
        background: var(--ink);
        color: #fff;
        border-color: var(--ink);
      }
      .card-tag-options {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }
      .card-tag-options label {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        border: 1px solid var(--rule);
        padding: 6px 8px;
        font-size: 12px;
        font-weight: 400;
      }
      .card-tag-options input {
        width: auto;
        margin: 0;

      aria-labelledby="card-title"
    >
      <div class="pick-panel">
        <div class="pick-head">
          <h2 id="card-title">LP card</h2>
          <button
            class="close"
            id="card-close"
            type="button"
            aria-label="Close card"
          >
            ×
          </button>
        </div>
        <form id="card-form" class="card-form">
          <label>Stack<select id="card-stage" required></select></label>
          <label
            >Owner<select id="card-owner">
              <option value="">Unknown owner</option>
              <option>Carlo</option>
              <option>Koko</option>
              <option>Zeg</option>
              <option>Henry</option>
              <option>Bene</option>
              <option>Armando</option>
              <option>Nahom</option>
            </select></label
          ><label>Stars<select id="card-tier" aria-label="LP stars">
              <option value="">No stars</option><option value="S">★★★★★ (5)</option><option value="A">★★★★ (4)</option><option value="B">★★★ (3)</option><option value="C">★★ (2)</option><option value="D">★ (1)</option><option value="F" hidden>★ (1)</option>
          </select></label><label
            >Priority<select id="card-priority" aria-label="LP priority">
              <option value="">No priority</option><option value="high">High</option><option value="mid">Mid</option><option value="low">Low</option>
          </select></label><label
            >Commitment ($M)<input
              id="card-commitment"
              type="number"
              min="0"
              step="any"
              inputmode="decimal"
              autocomplete="off"
              aria-label="Commitment in millions of dollars" /></label
          ><label
            >Check size ($M)<span class="minmax"><input
              id="card-min"
              type="number"
              min="0"
              step="any"
              inputmode="decimal"
              autocomplete="off"
              placeholder="Min"
              aria-label="Minimum check in millions of dollars" /><input
              id="card-max"
              type="number"
              min="0"
              step="any"
              inputmode="decimal"
              autocomplete="off"
              placeholder="Max"
              aria-label="Maximum check in millions of dollars" /></span></label
          ><label
            >Connection<input
              id="card-connection"
              maxlength="500"
              type="text"
              autocomplete="off" /></label
          ><label id="card-next-wrap"
            >Next step<input
              id="card-next"
              maxlength="200"
              type="text"
              autocomplete="off"
              placeholder="Send deck, intro call…" /></label
          ><label id="card-next-date-wrap"
            >Next step date<input id="card-next-date" type="date" /></label
          ><label id="card-commit-status-wrap"
            >Commit status<select id="card-commit-status" aria-label="Commitment status">
              <option value="committed">Committed</option>
              <option value="soft">Soft circled</option>
            </select></label
          ><label
            >Notes<textarea id="card-notes" maxlength="10000"></textarea>
          </label>
          <div>
            <label>Tags</label>
            <div id="card-tag-options" class="card-tag-options"></div>
            <div class="card-tag-create">
              <input id="card-tag-name" type="text" maxlength="32" placeholder="New tag" aria-label="New tag name" autocomplete="off" />
              <select id="card-tag-color" aria-label="New tag color">
                <option value="blue">Blue</option><option value="slate">Slate</option>
                <option value="teal">Teal</option><option value="green">Green</option>
                <option value="amber">Amber</option><option value="orange">Orange</option>
                <option value="rose">Rose</option><option value="violet">Violet</option>
              </select>
              <button id="card-tag-create" type="button">Create tag</button>
            </div>
          </div>
          <div class="form-actions">
            <button type="button" id="card-cancel">Cancel</button
            ><button type="submit" id="card-submit">Save card</button>
          </div>
        </form>
      </div>
    </div>
    <div class="feedback" id="feedback" role="status"></div>
    <script>
      let firms = [];
    </script>
    <script src="firms-data.js"></script>
    <script src="auth-lite.js"></script>
    <script>
      (function () {
        "use strict";
        const stages = [
          "Wishlist",
          "Warm",
          "Contacted",
          "In Process",
          "Committed",
        ];
        const sections = [
          "Historic Institutions",
          "Historic Individuals",
          "Historic Legacies",
          "Other",
        ];
        const institution = new Set(["endowment"]),
          individual = new Set([
            "family office",
            "sfo",
            "hnw",
            "private investment office",
          ]),
          legacy = new Set(["foundation", "philanthropic llc"]);
        const overrides = {
          "The Museum of Modern Art": 0,
          "Indiana University Foundation": 0,
          "University of Illinois Foundation": 0,
          "Georgia Tech Foundation": 0,
          "University of Massachusetts Foundation": 0,
          "Purdue Research Foundation": 0,
          "The California Endowment": 2,
          "Chan Zuckerberg Initiative (investment office)": 2,
          "Cleveland Clinic": 3,
          "Mayo Clinic": 3,
          "Memorial Sloan Kettering Cancer Center": 3,
          "Boston Children's Hospital": 3,
          "Children's Healthcare of Atlanta": 3,
          "Children's Hospital Los Angeles (CHLA)": 3,
          "Children's Hospital of Philadelphia (CHOP)": 3,
          "Dana-Farber Cancer Institute": 3,
          "Hackensack Meridian Health": 3,
          "NewYork-Presbyterian Office of Investments": 3,
          "Texas Children's Hospital": 3,
          "Mass General Brigham Investment Office": 3,
          "Sequoia Heritage": 3,
          "Global Endowment Management (GEM)": 3,
          Bilt: 3,
          "Harlem Children's Zone (endowment)": 3,
          "Council on Foreign Relations (endowment)": 3,
          Texas: 3,
          "The Nature Conservancy": 3,
        };
        function category(f) {
          const t = (f.type || "").toLowerCase();
          return sections[
            overrides[f.name] ??
              (institution.has(t)
                ? 0
                : individual.has(t)
                  ? 1
                  : legacy.has(t)
                    ? 2
                    : 3)
          ];
        }
        const $ = (id) => document.getElementById(id);
        const esc = (s) =>
          String(s == null ? "" : s).replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          );
        let state = { pipeline: {}, details: {}, tags: [], cardTags: [], commitments: {}, fundGoal: 500000000, touches: [], firmProfiles: {}, customFirms: [], stageTimes: {}, nextSteps: {}, commitStatus: {}, hasTouches: false, hasFirmProfiles: false, hasCustomFirms: false, hasStageTimes: false, hasNextStep: false, hasCommitStatus: false };
        let customFirmMap = new Map();
        let lastTouches = new Map();
        const normalizeCustom = (r) => ({ name: r.name, type: r.type, location: [r.city, r.state].filter(Boolean).join(", "), aum: r.aum, notes: r.notes, contacts: [], customId: r.id });
        function rebuildCustom() {
          customFirmMap = new Map(state.customFirms.map((r) => [10000 + +r.id, normalizeCustom(r)]));
        }
        function firmOf(id) {
          id = +id;
          return id >= 10000 ? customFirmMap.get(id) : firms[id];
        }
        const TOUCH_LABELS = { email: "Emailed", call: "Called", meeting: "Met", note: "Note" };
        const touchLabel = (k) => TOUCH_LABELS[k] || k;
        function fmtDay(d) {
          const dt = new Date(String(d).slice(0, 10) + "T00:00:00");
          return isNaN(dt) ? "" : dt.toLocaleDateString("en-US", { month: "short", day: "numeric" });
        }
        let selectedStage = stages[0];
        let view = "stacks";
        let profiles = null;
        let detailFirm = null;
        let detailReturn = null;
        let cardFirm = null;
        let cardIsNew = false;
        let activeFirm = null;
        let editTagId = null;
        let chosenColor = "blue";
        const colors = [
          "slate",
          "blue",
          "teal",
          "green",
          "amber",
          "orange",
          "rose",
          "violet",
        ];
        
        let loading = true;
        let saving = false;
        const db = window.ctAuth;
        function setStatus(msg, error = false) {
          $("auth").classList.toggle("error", error);
          $("auth").innerHTML = "<small>" + esc(msg) + "</small>";
        }
        function authUI() {
          $("auth").innerHTML = "";
        }
        async function loadPipeline() {
          loading = true;
          render();
          let data;
          try {
            const rows = await Promise.all([
              db.list(),
              db.tags(),
              db.cardTags(),
            ]);
            data = rows[0];
            state.tags = rows[1];
            state.cardTags = rows[2];
            await ensurePriorityTags();
          } catch (error) {
            loading = false;
            setStatus("Could not load pipeline", true);
            notice(error.message);
            return;
          }
          // Commitment tracker tables: tolerate absence so the board works before they exist.
          try { state.commitments = Object.fromEntries((await db.commitments()).map((r) => [r.firm_id, +r.amount])); }
          catch (e) { state.commitments = {}; }
          // Interaction layer tables: tolerate absence so the board works before the SQL update runs.
          try { state.touches = await db.touches(); state.hasTouches = true; }
          catch (e) { state.touches = []; state.hasTouches = false; }
          try { state.firmProfiles = Object.fromEntries((await db.firmProfiles()).map((r) => [r.firm_id, { min: r.min_commit, max: r.max_commit }])); state.hasFirmProfiles = true; }
          catch (e) { state.firmProfiles = {}; state.hasFirmProfiles = false; }
          try { state.customFirms = await db.customFirms(); state.hasCustomFirms = true; rebuildCustom(); }
          catch (e) { state.customFirms = []; state.hasCustomFirms = false; customFirmMap = new Map(); }
          try { state.stageTimes = Object.fromEntries((await db.stageTimes()).map((r) => [r.firm_id, r.stage_changed_at])); state.hasStageTimes = true; }
          catch (e) { state.stageTimes = {}; state.hasStageTimes = false; }
          try { state.nextSteps = Object.fromEntries((await db.nextSteps()).map((r) => [r.firm_id, { step: r.next_step || "", date: r.next_step_date || null }])); state.hasNextStep = true; }
          catch (e) { state.nextSteps = {}; state.hasNextStep = false; }
          try { state.commitStatus = Object.fromEntries((await db.commitmentsFull()).map((r) => [r.firm_id, r.status || "committed"])); state.hasCommitStatus = true; }
          catch (e) { state.commitStatus = {}; state.hasCommitStatus = false; }
          try {
            const funds = await db.funds();
            const iii = funds.find((f) => f.fund === "III");
            if (iii) state.fundGoal = +iii.goal;
          } catch (e) { /* keep default goal */ }
          renderFund();
          loading = false;
          state.pipeline = Object.fromEntries(
            data.map((row) => [row.firm_id, row.stage]),
          );
          state.details = Object.fromEntries(
            data.map((row) => [
              row.firm_id,
              {
                owner: row.owner || "",
                tier: row.tier || "",
                connection: row.connection || "",
                notes: row.notes || "",
              },
            ]),
          );
          renderFilter();
        }
        function save(id, stage) {
          if (loading || saving) {
            notice("Wait for the pipeline to finish loading");
            return false;
          }
          const old = state.pipeline[id];
          if (stage === null) delete state.pipeline[id];
          else state.pipeline[id] = stage;
          saving = true;
          render();
          (async () => {
            try {
              if (stage === null) await db.del(id);
              else await db.put(id, stage, state.hasStageTimes && old !== stage ? { stage_changed_at: new Date().toISOString() } : undefined);
              if (stage === null)
                state.cardTags = state.cardTags.filter(
                  (x) => x.firm_id !== +id,
                );
              saving = false;
              render();
              notice(stage === null ? "Removed" : "Saved to pipeline");
            } catch (error) {
              saving = false;
              if (old === undefined) delete state.pipeline[id];
              else state.pipeline[id] = old;
              await loadPipeline();
              notice("Not saved: " + error.message);
            }
          })();
          return true;
        }
        (async () => {
          try {
            authUI();
            await loadPipeline();
          } catch (e) {
            loading = false;
            setStatus("Could not connect. Reload the page.", true);
            notice(e.message);
          }
        })();
        function notice(s) {
          $("feedback").textContent = s;
          $("feedback").classList.add("show");
          clearTimeout(notice.t);
          notice.t = setTimeout(
            () => $("feedback").classList.remove("show"),
            2300,
          );
        }
        function records() {
          return Object.entries(state.pipeline).filter(
            ([id, stage]) =>
              Number.isInteger(+id) && firmOf(+id) && stages.includes(stage),
          );
        }
        function chips(id) {
          return state.cardTags
            .filter((x) => x.firm_id === +id)
            .map((x) => state.tags.find((t) => t.id === x.tag_id))
            .filter((t) => t && !isReservedTag(t))
            .map(
              (t) =>
                '<span class="tag-chip ' +
                t.color +
                '">' +
                esc(t.name) +
                "</span>",
            )
            .join("");
        }
        const starCount = (tier) => ({S:5, A:4, B:3, C:2, D:1, F:1})[tier] || 0;
        const starLabel = (tier) => starCount(tier) ? '★'.repeat(starCount(tier)) : '';
        /* H/M/L priority lives in the same Supabase tag store as card tags,
           as three reserved tags (High, Mid, Low); hidden from the tag UI the
           same way legacy star-tier tags (S/A/B/C/D/F) are. */
        const PRIORITY_LEVELS = ["high", "mid", "low"];
        const PRIORITY_RANK = { high: 3, mid: 2, low: 1 };
        const RESERVED_TAG_NAMES = new Set(["s", "a", "b", "c", "d", "f", ...PRIORITY_LEVELS]);
        const isReservedTag = (t) => RESERVED_TAG_NAMES.has(String(t.name).toLowerCase());
        function priorityTagIds(level) {
          return state.tags
            .filter((t) => String(t.name).toLowerCase() === level)
            .map((t) => t.id);
        }
        function priorityOf(id) {
          for (const level of PRIORITY_LEVELS) {
            const ids = priorityTagIds(level);
            if (ids.length && state.cardTags.some((x) => x.firm_id === +id && ids.includes(x.tag_id)))
              return level;
          }
          return "";
        }
        async function ensurePriorityTags() {
          for (const level of PRIORITY_LEVELS) {
            if (state.tags.some((t) => String(t.name).toLowerCase() === level)) continue;
            const name = level[0].toUpperCase() + level.slice(1);
            try { await db.createTag(name, "slate"); } catch (e) { /* lost a create race or no insert; re-read below */ }
            try { state.tags = await db.tags(); } catch (e) { /* keep prior tags */ }
          }
        }
        function cardVisible(id, q, filter) {
          return (
            (!filter ||
              state.cardTags.some(
                (x) => x.firm_id === +id && String(x.tag_id) === filter,
              )) &&
            (!q ||
              [
                firmOf(+id).name,
                firmOf(+id).type,
                firmOf(+id).location,
                ...(firmOf(+id).contacts || []).map((c) => c.name),
                ...state.cardTags
                  .filter((x) => x.firm_id === +id)
                  .map((x) => state.tags.find((t) => t.id === x.tag_id)?.name),
              ].some((x) =>
                String(x || "")
                  .toLowerCase()
                  .includes(q),
              ))
          );
        }
        const fmtM = (dollars) => {
          const m = dollars / 1e6;
          return "$" + (m >= 100 ? Math.round(m) : Math.round(m * 10) / 10) + "M";
        };
        function renderFund() {
          let committed = 0, soft = 0;
          for (const [id, amt] of Object.entries(state.commitments)) {
            if (state.hasCommitStatus && state.commitStatus[id] === "soft") soft += amt;
            else committed += amt;
          }
          const goal = state.fundGoal || 500000000;
          const cw = Math.min(100, (committed / goal) * 100);
          $("fund").hidden = false;
          $("fund-fill").style.width = cw + "%";
          $("fund-soft").style.width = Math.min(100 - cw, (soft / goal) * 100) + "%";
          $("fund-nums").innerHTML = "<b>" + fmtM(committed) + "</b> of " + fmtM(goal) + " committed" + (state.hasCommitStatus && soft ? ' · <b>' + fmtM(soft) + "</b> soft" : "");
        }
        function nextStepHTML(id) {
          if (!state.hasNextStep) return "";
          const n = state.nextSteps[+id] || { step: "", date: null };
          if (n.step && n.date) return '<div class="card-next">' + esc("\u2192 " + n.step + " \u00b7 " + fmtDay(n.date)) + "</div>";
          return '<div class="card-next missing">' + esc(n.step ? "\u2192 " + n.step + " \u00b7 no date" : "No next step") + "</div>";
        }
        function renderToday() {
          const el = $("today");
          const stageRank = { "In Process": 0, Contacted: 1, Warm: 2, Wishlist: 3 };
          const cands = records()
            .filter(([, s]) => s !== "Committed")
            .map(([id, s]) => {
              const t = lastTouches.get(+id);
              const days = t ? Math.floor((Date.now() - new Date(String(t.touched_at).slice(0, 10) + "T00:00:00").getTime()) / 864e5) : 9999;
              const prof = state.firmProfiles[+id] || {};
              return { id: +id, stage: s, days, check: prof.max || 0, rank: stageRank[s] != null ? stageRank[s] : 4 };
            })
            .sort((a, b) => b.days - a.days || a.rank - b.rank || b.check - a.check)
            .slice(0, 5);
          if (!cands.length) { el.hidden = true; return; }
          el.hidden = false;
          el.innerHTML = '<div class="today-head">Today</div>' + cands.map((c) => {
            const meta = c.stage + " \u00b7 " + (c.days === 9999 ? "never touched" : c.days === 0 ? "touched today" : c.days + "d quiet");
            return '<div class="today-row"><button type="button" class="today-name" data-open-detail="' + c.id + '">' + esc(firmOf(c.id).name) + '</button><span class="today-meta">' + esc(meta) + '</span><span class="today-log">' + ["email", "call", "meeting"].map((k) => '<button type="button" class="touch-btn" data-today-touch="' + c.id + ":" + k + '">' + touchLabel(k) + "</button>").join("") + "</span></div>";
          }).join("");
        }
        function touchLineHTML(id) {
          const t = lastTouches.get(+id);
          if (!t) return "";
          return '<div class="card-touch">' + esc(touchLabel(t.kind) + " · " + fmtDay(t.touched_at)) + "</div>";
        }
        function renderKpis() {
          const rows = records();
          const cells = [];
          if (state.hasTouches) {
            const weekAgo = Date.now() - 7 * 864e5;
            const tw = state.touches.filter((t) => new Date(String(t.touched_at).slice(0, 10) + "T00:00:00").getTime() >= weekAgo).length;
            const stale = rows.filter(([id]) => {
              const t = lastTouches.get(+id);
              return !t || Date.now() - new Date(String(t.touched_at).slice(0, 10) + "T00:00:00").getTime() >= 14 * 864e5;
            }).length;
            cells.push('<div class="kpi"><b>' + tw + '</b><span>Touches</span><small>7 days</small></div>');
            cells.push('<div class="kpi"><b>' + stale + '</b><span>Stale</span><small>14d+ quiet</small></div>');
          }
          if (state.hasStageTimes) {
            const days = rows.map(([id]) => state.stageTimes[+id]).filter(Boolean).map((ts) => (Date.now() - new Date(ts).getTime()) / 864e5);
            if (days.length) cells.push('<div class="kpi"><b>' + Math.round(days.reduce((a, b) => a + b, 0) / days.length) + '</b><span>Avg days</span><small>in stage</small></div>');
          }
          $("kpis").innerHTML = cells.join("");
        }
        function rankHTML(id, d, prio) {
          const commit = state.commitments[+id];
          if (!d.tier && !d.owner && !prio && !commit) return "";
          return (
            '<div class="card-rank">' +
            (d.tier ? '<span class="tier-pill" data-stars="' + starCount(d.tier) + '" aria-label="' + starCount(d.tier) + ' stars">' + starLabel(d.tier) + '</span>' : '') +
            (prio ? '<span class="prio-pill" data-prio="' + prio + '" aria-label="' + prio + ' priority">' + prio[0].toUpperCase() + '</span>' : '') +
            (commit ? '<span class="commit-pill" aria-label="Commitment ' + fmtM(commit) + '">' + fmtM(commit) + '</span>' : '') +
            (d.owner ? '<span class="card-owner" aria-label="Owner: ' + esc(d.owner) + '">' + esc(d.owner) + '</span>' : '') +
            '</div>'
          );
        }
        function cardTagsHTML(id) {
          const c = chips(id);
          return c ? '<div class="tags">' + c + "</div>" : "";
        }
        function render() {
          const q = $("board-search").value.trim().toLowerCase();
          const filter = $("tag-filter").value;
          const all = records();
          lastTouches = new Map();
          for (const t of state.touches) if (!lastTouches.has(t.firm_id)) lastTouches.set(t.firm_id, t);
          renderKpis();
          renderToday();
          $("board-search").disabled = loading;
          $("manage-tags").disabled = loading || saving;
          $("total").textContent =
            all.length + " LP" + (all.length === 1 ? "" : "s");
          const board = $("board");
          board.classList.toggle("list", view === "list");
          board.setAttribute("aria-label", view === "list" ? "LP pipeline list" : "LP pipeline board");
          if (view === "list") {
            board.innerHTML = renderList(all, q, filter);
            return;
          }
          board.innerHTML = stages
            .map((stage) => {
              const cards = all.filter(
                ([id, s]) => s === stage && cardVisible(id, q, filter),
              );
              return (
                '<section class="stack" data-stage="' +
                stage +
                '"><div class="stack-head"><h3><button type="button" data-add-stage="' +
                stage +
                '" aria-label="Add LP to ' + stage + '">' + stage + '</button></h3><span>' +
                cards.length +
                '</span></div><div class="stack-body">' +
                (cards.length
                  ? cards
                      .map(([id]) => {
                        const f = firmOf(+id);
                        const d = state.details[id] || {};
                        const prio = priorityOf(id);
                        return (
                          '<article class="card" draggable="true" data-stars="' + (starCount(d.tier) || '') + '" data-priority="' + prio + '" data-id="' +
                          id +
                          '" tabindex="0" aria-label="' +
                          esc(f.name) +
                          '; open details with Enter, drag to move or use arrow keys"><div class="card-top"><button class="card-name" type="button" data-open-detail="' +
                          id +
                          '">' +
                          esc(f.name) +
                          '</button><button class="grip" type="button" aria-label="Drag ' +
                          esc(f.name) +
                          '">⋮⋮</button></div>' +
                          rankHTML(id, d, prio) +
                          touchLineHTML(id) +
                          nextStepHTML(id) +
                          cardTagsHTML(id) +
                          '</article>'
                        );
                      })
                      .join("")
                  : '<div class="empty">' +
                    (loading
                      ? "Loading…"
                      : q || filter
                        ? "No matches"
                        : "Drop LPs here") +
                    "</div>") +
                "</div></section>"
              );
            })
            .join("");
        }
        function renderList(all, q, filter) {
          const rows = all
            .filter(([id]) => cardVisible(id, q, filter))
            .map(([id, stage]) => ({ id: +id, stage }))
            .sort(
              (a, b) =>
                starCount(state.details[b.id]?.tier) -
                  starCount(state.details[a.id]?.tier) ||
                (PRIORITY_RANK[priorityOf(b.id)] || 0) -
                  (PRIORITY_RANK[priorityOf(a.id)] || 0) ||
                firmOf(a.id).name.localeCompare(firmOf(b.id).name, undefined, {
                  sensitivity: "base",
                  numeric: true,
                }),
            );
          if (!rows.length)
            return (

        });
        $("close").onclick = close;
        $("card-close").onclick = closeCard;
        $("card-cancel").onclick = closeCard;
        $("card-modal").addEventListener("pointerdown", (e) => {
          if (e.target === $("card-modal")) closeCard();
        });
        const fabMenu = $("fab-menu");
        function closeFab() {
          fabMenu.hidden = true;
          $("fab").setAttribute("aria-expanded", "false");
        }
        $("fab").addEventListener("click", () => {
          const opening = fabMenu.hidden;
          if (opening) {
            fabMenu.hidden = false;
            $("fab").setAttribute("aria-expanded", "true");
          } else closeFab();
        });
        document.addEventListener("pointerdown", (e) => {
          if (!fabMenu.hidden && !e.target.closest(".fab-wrap")) closeFab();
        });
        $("fab-add-card").addEventListener("click", () => {
          closeFab();
          open(stages[0]);
        });
        $("fab-add-lp").addEventListener("click", () => {
          closeFab();
          $("lp-name").value = "";
          $("lp-city").value = "";
          $("lp-state").value = "";
          $("lp-aum").value = "";
          $("lp-notes").value = "";
          $("lp-stage").value = "";
          $("lp-modal").classList.add("show");
          $("lp-name").focus();
        });
        function closeLp() {
          $("lp-modal").classList.remove("show");
        }
        $("lp-close").onclick = closeLp;
        $("lp-cancel").onclick = closeLp;
        $("lp-modal").addEventListener("pointerdown", (e) => {
          if (e.target === $("lp-modal")) closeLp();
        });
        $("lp-form").addEventListener("submit", async (e) => {
          e.preventDefault();
          const name = $("lp-name").value.trim();
          if (!name) return;
          const rec = {
            name,
            type: $("lp-type").value,
            city: $("lp-city").value.trim(),
            state: $("lp-state").value.trim(),
            aum: $("lp-aum").value.trim(),
            notes: $("lp-notes").value.trim(),
          };
          const stage = $("lp-stage").value;
          $("lp-submit").disabled = true;
          try {
            const rows = await db.addCustomFirm(rec);
            const row = Array.isArray(rows) ? rows[0] : rows;
            state.customFirms.push(row);
            rebuildCustom();
            const firmId = 10000 + +row.id;
            closeLp();
            if (stage) {
              try {
                await db.put(firmId, stage, state.hasStageTimes ? { stage_changed_at: new Date().toISOString() } : undefined);
                state.pipeline[firmId] = stage;
                state.details[firmId] = { owner: "", tier: "", connection: "", notes: "" };
                notice(name + " added to " + stage);
              } catch (err) {
                notice(name + " rostered; card failed: " + err.message);
              }
            } else notice(name + " added to roster");
            render();
          } catch (err) {
            notice("LP not saved: " + err.message);
          } finally {
            $("lp-submit").disabled = false;
          }
        });
        function openGlobe() {
          const frame = $("globe-frame");
          if (!frame.dataset.loaded) {
            frame.src = "globe.html";
            frame.dataset.loaded = "1";
          }
          $("globe-modal").classList.add("show");
        }
        function closeGlobe() {
          $("globe-modal").classList.remove("show");
        }
        $("open-globe").addEventListener("click", openGlobe);
        $("globe-close").addEventListener("click", closeGlobe);
        $("globe-modal").addEventListener("pointerdown", (e) => {
          if (e.target === $("globe-modal")) closeGlobe();
        });
        $("picker").addEventListener("pointerdown", (e) => {
          if (e.target === $("picker")) close();
        });
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && !fabMenu.hidden)
            closeFab();
          else if (e.key === "Escape" && $("lp-modal").classList.contains("show"))
            closeLp();
          else if (e.key === "Escape" && $("globe-modal").classList.contains("show"))
            closeGlobe();
          else if (e.key === "Escape" && $("detail-modal").classList.contains("show"))
            closeDetail();
          else if (e.key === "Escape" && $("card-modal").classList.contains("show"))
            closeCard();
          else if (e.key === "Escape" && $("picker").classList.contains("show"))
            close();
          else if (
            e.key === "Escape" &&
            $("tag-modal").classList.contains("show")
          )
            closeTags();
        });
        $("pick-search").oninput = picker;
        $("board-search").oninput = render;
        $("pick-list").onclick = (e) => {
          const b = e.target.closest("[data-add]");
          if (!b) return;
          close();
          openCard(+b.dataset.add, true);
        };
        $("card-form").onsubmit = async (e) => {
          e.preventDefault();
          if (saving || cardFirm === null) return;
          const minC = parseFloat($("card-min").value);
          const maxC = parseFloat($("card-max").value);
          if (!isNaN(minC) && !isNaN(maxC) && minC > maxC) {
            notice("Min check exceeds max");
            $("card-min").focus();
            return;
          }
          const id = cardFirm,
            detail = {
              owner: $("card-owner").value,
              tier: $("card-tier").value,
              connection: $("card-connection").value.trim(),
              notes: $("card-notes").value.trim(),
            };
          if (state.hasNextStep) {
            detail.next_step = $("card-next").value.trim();
            detail.next_step_date = $("card-next-date").value || null;
          }
          const chosen = new Set(
              [...$("card-tag-options").querySelectorAll("input:checked")].map(
                (x) => +x.value,
              ),
            );
          const old = new Set(
              state.cardTags
                .filter((x) => x.firm_id === id)
                .map((x) => x.tag_id),
            );
          saving = true;
          $("card-submit").disabled = true;
          try {
            const stage = $("card-stage").value;
            if (!stages.includes(stage)) throw new Error("Choose a stack");
            if (state.hasStageTimes && state.pipeline[id] !== stage)
              detail.stage_changed_at = new Date().toISOString();
            await db.put(id, stage, detail);
            for (const tag of state.tags) {
              if (isReservedTag(tag)) continue;
              if (chosen.has(tag.id) !== old.has(tag.id))
                await db.setCardTag(id, tag.id, chosen.has(tag.id));
            }
            const prio = $("card-priority").value;
            for (const level of PRIORITY_LEVELS) {
              for (const tid of priorityTagIds(level)) {
                const want = prio === level;
                const has = state.cardTags.some(
                  (x) => x.firm_id === id && x.tag_id === tid,
                );
                if (want !== has) await db.setCardTag(id, tid, want);
              }
            }
            const commitM = parseFloat($("card-commitment").value);
            const hadCommit = state.commitments[id] != null;
            if (commitM > 0) {
              await db.putCommitment(id, Math.round(commitM * 1e6), state.hasCommitStatus ? $("card-commit-status").value : undefined);
            } else if (hadCommit) {
              await db.deleteCommitment(id);
            }
            const minV = isNaN(minC) ? null : minC;
            const maxV = isNaN(maxC) ? null : maxC;
            if (minV !== null || maxV !== null || state.firmProfiles[id]) {
              try {
                await db.putFirmProfile(id, minV, maxV);
                state.firmProfiles[id] = { min: minV, max: maxV };
              } catch (err) {
                notice("Check size not saved: " + err.message);
              }
            }
            closeCard();
            await loadPipeline();
            notice("Card saved");
          } catch (error) {
            await loadPipeline();
            notice("Not saved: " + error.message);
          } finally {
            saving = false;
            $("card-submit").disabled = false;
            render();
          }
        };
        $("board").addEventListener("keydown", (e) => {
          const c = e.target.closest(".card");
          if (!c || e.target !== c) return;
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            openDetail(+c.dataset.id);
            return;
          }
          if (view !== "stacks") return;
          if (!["ArrowRight", "ArrowLeft"].includes(e.key)) return;
          e.preventDefault();
          const id = c.dataset.id;
          const n =
            stages.indexOf(state.pipeline[id]) +
            (e.key === "ArrowRight" ? 1 : -1);
          if (n < 0 || n >= stages.length) return;
          if (!save(id, stages[n])) return;
          document.querySelector('.card[data-id="' + id + '"]')?.focus();
          notice("Moved to " + stages[n]);
        });
        let dragId = null;
        $("board").addEventListener("dragstart", (e) => {
          const c = e.target.closest(".card");
          if (!c) return;
          dragId = c.dataset.id;
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("text/plain", dragId);
          setTimeout(() => c.classList.add("dragging"), 0);
        });
        $("board").addEventListener("dragover", (e) => {
          const s = e.target.closest(".stack");
          if (s) {
            e.preventDefault();
            e.dataTransfer.dropEffect = "move";
            document
              .querySelectorAll(".stack.over")
              .forEach((x) => x.classList.remove("over"));
            s.classList.add("over");
          }
        });
        $("board").addEventListener("drop", (e) => {
          const s = e.target.closest(".stack");
          if (!s) return;
          e.preventDefault();
          const id = dragId || e.dataTransfer.getData("text/plain");
          if (
            !saving &&
            state.pipeline[id] &&
            s.dataset.stage !== state.pipeline[id]
          ) {
            save(id, s.dataset.stage);
          } else
            document
              .querySelectorAll(".stack.over")
              .forEach((x) => x.classList.remove("over"));
          dragId = null;
        });
        $("board").addEventListener("dragend", () => {
          dragId = null;
          document
            .querySelectorAll(".stack.over,.card.dragging")
            .forEach((x) => x.classList.remove("over", "dragging"));
        });
        let touch = null;
        $("board").addEventListener("pointerdown", (e) => {
          const grip = e.target.closest(".grip");
          if (!grip || e.pointerType === "mouse") return;
          e.preventDefault();
          const card = grip.closest(".card");
          touch = {
            id: card.dataset.id,
            x: e.clientX,
            y: e.clientY,
            ghost: null,
          };
          card.classList.add("touch-drag");
          grip.setPointerCapture(e.pointerId);
        });
        $("board").addEventListener("pointermove", (e) => {
          if (!touch) return;
          e.preventDefault();
          if (
            !touch.ghost &&
            Math.hypot(e.clientX - touch.x, e.clientY - touch.y) > 5
          ) {
            touch.ghost = document
              .querySelector('.card[data-id="' + touch.id + '"]')
              .cloneNode(true);
            touch.ghost.classList.add("drag-ghost");
            document.body.append(touch.ghost);
          }
          if (touch.ghost) {
            const viewport = $("board").getBoundingClientRect();
            if (e.clientX > viewport.right - 35) $("board").scrollLeft += 25;
            else if (e.clientX < viewport.left + 35)
              $("board").scrollLeft -= 25;
            touch.ghost.style.left = e.clientX - 100 + "px";
            touch.ghost.style.top = e.clientY - 35 + "px";
            document
              .querySelectorAll(".stack.over")
              .forEach((x) => x.classList.remove("over"));
            const hitX = Math.max(
              viewport.left + 1,
              Math.min(viewport.right - 1, e.clientX),
            );
            const under = document
              .elementFromPoint(hitX, e.clientY)
              ?.closest(".stack");
            if (under) under.classList.add("over");
          }
        });
        function finish(e) {
          if (!touch) return;
          const viewport = $("board").getBoundingClientRect();
          const hitX = Math.max(
            viewport.left + 1,
            Math.min(viewport.right - 1, e.clientX),
          );
          const s = document
            .elementFromPoint(hitX, e.clientY)
            ?.closest(".stack");
          touch.ghost?.remove();
          document
            .querySelector(".card.touch-drag")
            ?.classList.remove("touch-drag");
          if (!saving && s && s.dataset.stage !== state.pipeline[touch.id]) {
            save(touch.id, s.dataset.stage);
          } else
            document
              .querySelectorAll(".stack.over")
              .forEach((x) => x.classList.remove("over"));
          touch = null;
        }
        $("board").addEventListener("pointerup", finish);
        $("board").addEventListener("pointercancel", finish);
        render();
      })();
    </script>
  </body>
</html>
